  ['ov', 'Overlaps with other teams', 'Every day Index compares plans across workstreams and flags conflicts, such as two teams changing the same API. Start a thread with both owners, ask who decides, or dismiss it.', 'See overlaps', () => go('home'),
    '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>'],
  ['search', 'Search with filters', 'Search files or ask a question in plain language. Filter results by file type and date. Filters apply to search only. Press / anywhere to jump to search.', 'Try a search', () => { $('#q').value = 'What did we decide about the permissions architecture?'; go('search', { query: $('#q').value, scope: null, tab: 'all' }); },
    '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'],
  ['ask', 'Answers that ask for missing context', 'Index shows the files it read and cites each claim. When the files don\'t say, it asks the doc owner, or you, depending on your settings.', 'Ask a question', () => { $('#q').value = 'Is history sync on in incognito?'; go('search', { query: $('#q').value, scope: null, tab: 'all' }); },
    '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/>'],
  ['repair', 'Docs that repair themselves', 'When a decision changes, Index finds the docs that still say the old thing and suggests an exact edit. Nothing changes until you apply it or send it to the owner.', 'Review a fix', () => openFile('p2'),
    '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>'],
  ['notif', 'Notifications', 'The bell collects questions from teammates, out-of-date docs and requests for context. Choose what reaches you in Settings.', 'Notification settings', () => go('settings', { settingsTab: 'notifications' }),
    '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>'],
];
const HELP_FAQ = [
  ['Does Index change my files without asking?', 'No. Index suggests edits. A doc only changes when you or its owner applies the fix, and every change is logged in the workstream activity.'],
  ['Who can see what Index reads?', 'Only people who already have access to a file can see it in Index. Blocking a source in Settings removes it from every search.'],
  ['How does Index decide who to ask?', 'By default it asks the owner of the document that is missing the answer. You can switch this to only you, or turn questions off.'],
  ['How fast are answers?', 'Most searches return in under a second because Index searches its own index rather than every source live. Answers that need a teammate\'s reply arrive in your notifications.'],
];
function renderHelp(el) {
  const nav = [['start', 'Getting started'], ['features', 'Features'], ['faq', 'FAQ'], ['contact', 'Contact support']];
  el.innerHTML = `<div class="col" style="gap:28px">
    <div class="help-hero"><h1>Help center</h1><p>Index keeps cross-team knowledge current, so you can see what other teams are shipping and catch conflicts before they break your work.</p></div>
    <div class="help">
      <nav class="snav" aria-label="Help sections">${nav.map(([k, l], i) => `<button type="button" data-hs="${k}" aria-current="${i === 0}">${l}</button>`).join('')}</nav>
      <div class="col" style="gap:36px">
        <section id="h-start"><h2>Getting started</h2><div class="steps">
          ${[['Connect sources', 'Choose which folders and apps Index can read. You can change this any time.'], ['Pick your workstreams', 'Join the work you own and watch the teams you depend on.'], ['Check overlaps', 'Review the conflicts Index finds and loop in the right people.']].map(([t, p], i) => `<div class="step"><span class="n">${i + 1}</span><b>${t}</b><p>${p}</p></div>`).join('')}
        </div></section>
        <section id="h-features"><h2>Features</h2><div class="feats">
          ${HELP_FEATS.map(([k, t, p, cta, , ic]) => `<article class="feat" id="f-${k}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></span><h3>${t}</h3><p>${p}</p><button class="btn" type="button" data-try="${k}">${cta} →</button></article>`).join('')}
        </div></section>
        <section id="h-faq"><h2>FAQ</h2><div class="panel faq">${HELP_FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></section>
        <section id="h-contact" class="panel"><div class="help-contact"><div><b style="font-weight:500">Still stuck?</b><p>Our team usually replies within one business day.</p></div><a class="btn" href="mailto:support@index.app" data-dead style="text-decoration:none">Contact support</a></div></section>
      </div>
    </div></div>`;
  el.querySelectorAll('[data-try]').forEach(b => b.addEventListener('click', () => HELP_FEATS.find(f => f[0] === b.dataset.try)[4]()));
  el.querySelectorAll('[data-hs]').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('[data-hs]').forEach(x => x.setAttribute('aria-current', x === b));
    $('#h-' + b.dataset.hs).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }));
}

// ---------- settings ----------
function renderSettings(el) {
  const t = state.settingsTab;
  const sw = (key, on) => `<button class="switch" type="button" role="switch" data-sw="${key}" aria-checked="${on}" aria-label="${key}"></button>`;
  const sections = {
    profile: `<section class="panel"><div class="profile"><img src="people/me.jpg" alt=""><div><b>You</b><small>${esc(PEOPLE.me.role)} · working on ${WS.filter(w => w.team.includes('me')).length} workstreams, watching ${WS.filter(w => w.watch.includes('me')).length}</small></div></div>
      <div class="srow"><div><b>Role</b><small>Shown to teammates when Index routes a question to you</small></div><input class="field" id="roleIn" value="${esc(PEOPLE.me.role)}"></div>
      <div class="srow"><div><b>Answer questions about</b><small>Index sends you questions on these topics first</small></div><span class="pill">Permissions</span></div></section>`,
    sources: `<section class="panel">${SOURCES.map(s => `<div class="srow"><div><b>${esc(s.label)}</b><span class="mono">${esc(s.path)} · ${s.items} items</span></div>
      <div class="seg" data-s="${s.id}">${['allow','block'].map(v => `<button type="button" data-v="${v}" aria-pressed="${s.mode === v}">${v === 'allow' ? 'Allow' : 'Block'}</button>`).join('')}</div></div>`).join('')}</section>`,
    notifications: `<section class="panel">
      <div class="srow"><div><b>Questions from teammates</b><small>When someone asks you something through Index</small></div>${sw('questions', state.notify.questions)}</div>
      <div class="srow"><div><b>Out-of-date docs, workstreams I'm working on</b><small>Index suggests a fix you can apply</small></div>${sw('staleWorking', state.notify.staleWorking)}</div>
      <div class="srow"><div><b>Out-of-date docs, workstreams I'm watching</b><small>Usually the owners handle these</small></div>${sw('staleWatching', state.notify.staleWatching)}</div></section>`,
    context: `<section class="panel">
      <div class="srow"><div><b>When files don't answer a question</b><small>Who Index asks for the missing context</small></div>
        <div class="seg" id="askPolicy">${[['owner','The doc owner'],['me','Only me'],['block','Never ask']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${state.askPolicy === (v === 'block' ? 'never' : v)}">${l}</button>`).join('')}</div></div>
      <div class="srow"><div><b>Draft replies for me</b><small>Index writes a first draft from pinned files when a teammate asks you something</small></div>${sw('draft', state.draftReplies)}</div></section>`,
  };
  el.innerHTML = `<div class="col" style="gap:22px">
    <button class="back" id="back" type="button">← Back to workstreams</button>
    <div class="q-head"><h1>Settings</h1></div>
    <div class="settings">
      <nav class="snav" aria-label="Settings sections">${SETTINGS_TABS.map(([k, l]) => `<button type="button" data-st="${k}" aria-current="${k === t}">${l}</button>`).join('')}</nav>
      <div class="col"><div class="q-head" style="margin-top:-6px"><h3 style="margin:0;font-size:17px;font-weight:500">${SETTINGS_TABS.find(x => x[0] === t)[1]}</h3>
        ${t === 'sources' ? '<div class="scope">Index only opens what you allow. Blocked locations are skipped in every search.</div>' : ''}</div>${sections[t]}</div>
    </div></div>`;
  $('#back').addEventListener('click', () => go('home'));
  el.querySelectorAll('.snav [data-st]').forEach(b => b.addEventListener('click', () => { state.settingsTab = b.dataset.st; renderSettings(el); }));
  el.querySelectorAll('.seg[data-s] button').forEach(b => b.addEventListener('click', () => { const s = src(b.parentElement.dataset.s); s.mode = b.dataset.v; renderSettings(el); toast(`${s.label}: ${b.textContent}`); }));
  el.querySelectorAll('#askPolicy button').forEach(b => b.addEventListener('click', () => { state.askPolicy = b.dataset.v === 'block' ? 'never' : b.dataset.v; renderSettings(el); }));
  el.querySelectorAll('[data-sw]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sw; if (k === 'draft') state.draftReplies = !state.draftReplies; else state.notify[k] = !state.notify[k]; renderSettings(el);
  }));
  if ($('#roleIn')) $('#roleIn').addEventListener('change', e => { PEOPLE.me.role = e.target.value || 'Product manager'; toast('Role updated'); });
}

function render() {
  const el = $('#view');
  document.body.classList.toggle('auth', state.view === 'login');
  updateBell();
  updateFilterBadge();
  if (state.view !== 'search') runId++;
  ({ login: renderLogin, help: renderHelp, home: renderHome, ws: renderWs, search: renderSearch, settings: renderSettings })[state.view](el);
  if (state.view === 'ws') el.querySelectorAll('.results [data-goto]').forEach(b => b.addEventListener('click', () => go('ws', { wsId: b.dataset.goto })));
}
render();
