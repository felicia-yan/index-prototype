<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<meta name="description" content="Index asks the person who knows, on a card they can confirm, correct, or pass on.">
<link rel="icon" href="icons/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:opsz,wght@6..72,480;6..72,560&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #e6e9ef;
    --ink: #16181d;
    --sheet: #fbfcfe;
    --line: #d3d8e2;
    --brand: #232fd3;
    --tab: #9f1d16;
    --muted: #3e4a56;
    --known: #0f6b3c;
    --shadow: 6px 7px 0 #16181d;
    --sans: Figtree, "Avenir Next", "Segoe UI", sans-serif;
    --serif: Newsreader, "Iowan Old Style", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--field);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16.5px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  ::selection { background: #d9dcf7; }
  img { max-width: 100%; }
  .skip {
    position: absolute; left: 8px; top: -48px; background: var(--sheet);
    padding: 8px 10px; z-index: 40;
  }
  .skip:focus { top: 8px; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }
  header {
    position: sticky; top: 0; z-index: 4;
    background: var(--field);
    border-bottom: 1px solid var(--line);
    padding: 12px 22px 14px;
  }
  body:not(.in) header { display: none; }
  .bar-top, .bar-tools, .ask, .actions, .line, .from, .foot, .pair {
    display: flex; align-items: center; gap: 10px;
  }
  .bar-top { justify-content: space-between; margin-bottom: 10px; }
  .brand, .text {
    background: none; border: 0; padding: 0;
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 18px;
  }
  .brand img { height: 22px; width: auto; }
  .text { font-weight: 600; font-size: 15px; color: var(--brand); }
  .you { font-size: 14px; color: var(--muted); }
  .ask { gap: 8px; }
  .ask input, .stack input, .stack textarea, .stack select {
    width: 100%;
    background: var(--sheet);
    border: 1px solid var(--line);
    padding: 10px 12px;
  }
  .stack input[type="checkbox"], .stack input[type="radio"],
  input[type="checkbox"], input[type="radio"] {
    width: auto; padding: 0; border: 0; background: none;
  }
  label:has(input[type="checkbox"]), label:has(input[type="radio"]) {
    display: flex; align-items: center; gap: 8px; width: fit-content;
  }
  .ask input { height: 46px; flex: 1; min-width: 0; width: auto; }
  #ask-error, .problem { color: var(--tab); font-size: 14.5px; margin: 8px 0 0; }
  #bell-pop {
    position: absolute; right: 22px; top: 100%;
    width: min(380px, calc(100vw - 24px));
    background: var(--sheet);
    border: 1px solid var(--ink);
    padding: 8px;
    z-index: 6;
  }
  #bell-pop button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 8px;
  }
  #bell-pop button:hover { background: var(--field); }
  .count {
    background: var(--tab); color: white;
    min-width: 1.3em; text-align: center;
    font-size: 13px; padding: 0 5px;
  }
  main { min-height: calc(100vh - 120px); }
  .wrap { max-width: 740px; margin: 0 auto; padding: 28px 20px 72px; }
  h1 { font-size: 1.85rem; line-height: 1.15; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  h2 { font-size: 15px; font-weight: 700; margin: 32px 0 8px; overflow-wrap: anywhere; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .lede { font-size: 1.05rem; max-width: 38em; }
  .btn {
    background: var(--sheet);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    min-height: 40px;
  }
  .btn.solid { background: var(--ink); color: var(--sheet); }
  .card {
    position: relative;
    background: var(--sheet);
    border: 1px solid var(--line);
    padding: 22px 20px 16px;
    margin: 14px 0 8px;
    max-width: 640px;
  }
  .card.open { box-shadow: var(--shadow); }
  .tab {
    position: absolute; top: -1px; right: 16px;
    background: var(--tab); color: white;
    padding: 5px 10px 7px; font-size: 13.5px; font-weight: 700;
  }
  .draft {
    font-family: var(--serif);
    font-size: 1.45rem;
    font-weight: 480;
    line-height: 1.28;
    margin: 14px 0;
    overflow-wrap: anywhere;
  }
  .from { margin-bottom: 6px; }
  .face { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .clips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .cite, .clips button, .ev-list button.title {
    background: none; border: 0; padding: 0;
    color: var(--brand); text-align: left;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .gap, .banner, .hint, .filed { font-size: 15px; }
  .banner { font-weight: 700; }
  .filed { color: var(--known); font-weight: 700; }
  .actions { flex-wrap: wrap; margin-top: 8px; }
  .line {
    width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line);
    padding: 12px 0; gap: 12px; align-items: flex-start; flex-wrap: wrap;
  }
  .line .grow { flex: 1; min-width: 0; }
  .item { border-top: 1px solid var(--line); padding: 12px 0 14px; }
  .item .clip { margin: 4px 0 10px; }
  .src {
    display: grid;
    grid-template-columns: minmax(140px, 1fr) minmax(0, 1.4fr);
    gap: 8px 16px;
    align-items: center;
    border-top: 1px solid var(--line);
    padding: 10px 0;
  }
  .src .preview { grid-column: 1 / -1; justify-self: start; }
  .clips { flex-direction: column; align-items: flex-start; }
  .line strong, .clip { display: block; }
  .clip {
    color: var(--muted); font-size: 14.5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .stack { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .stack label { font-weight: 700; font-size: 14.5px; }
  textarea { min-height: 120px; resize: vertical; }
  .foot { gap: 16px; margin-top: 36px; font-size: 14.5px; }
  .foot a { color: var(--muted); }
  .login {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(280px, 420px);
  }
  .login-copy { padding: 56px 40px; }
  .login-side {
    background: var(--sheet);
    border-left: 1px solid var(--line);
    padding: 56px 32px;
  }
  .sso { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .sso .btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .scrim {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(22, 24, 29, .45);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 16px; overflow: auto;
  }
  .evidence {
    background: var(--sheet);
    width: min(560px, 100%);
    border: 1px solid var(--line);
    padding: 18px 18px 22px;
  }
  .passage { font-size: 1.05rem; overflow-wrap: anywhere; }
  .blocked { background: var(--field); padding: 12px; }
  #toast {
    position: fixed; left: 16px; bottom: 16px; z-index: 20;
    background: var(--ink); color: var(--sheet);
    padding: 10px 14px; max-width: min(380px, calc(100vw - 32px));
  }
  body.modal { overflow: hidden; }
  @media (max-width: 800px) {
    .card.open { box-shadow: 4px 4px 0 #16181d; }
    .src { grid-template-columns: 1fr; }
    .login { display: flex; flex-direction: column; }
    .login-side { order: -1; border-left: 0; border-bottom: 1px solid var(--line); padding: 28px 20px; }
    .login-copy { padding: 28px 20px 48px; }
    header { padding: 12px 14px 14px; }
    .bar-tools { gap: 8px; }
    .wrap { padding: 22px 14px 64px; }
    h1 { font-size: 1.55rem; }
    .draft { font-size: 1.28rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header>
  <div class="bar-top">
    <button class="brand" type="button" data-act="home" aria-label="Index home"><img src="icons/logo.svg" alt="">Index</button>
    <div class="bar-tools">
      <button class="btn" type="button" data-act="bell" id="bell" aria-label="Cards that need you" aria-expanded="false">Cards <span class="count" id="bell-count" hidden>0</span></button>
      <button class="btn" type="button" data-act="settings">Settings</button>
      <span class="you">You</span>
    </div>
  </div>
  <form class="ask" data-form="ask" novalidate role="search">
    <label class="sr" for="q">Ask</label>
    <input id="q" type="search" placeholder="Ask what another team decided" autocomplete="off" enterkeyhint="search">
    <button class="btn solid" type="submit">Ask</button>
  </form>
  <p id="ask-error" role="alert" hidden></p>
  <div id="bell-pop" hidden></div>
</header>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" hidden></div>
<script>
const PEOPLE = {
  me:     { name: 'You', role: 'Product manager' },
  alice:  { name: 'Alice Wang', role: 'PM, Platform' },
  david:  { name: 'David Chen', role: 'Eng lead, Platform' },
  priya:  { name: 'Priya Natarajan', role: 'Backend engineer' },
  marcus: { name: 'Marcus Hill', role: 'Legal counsel' },
  sam:    { name: 'Sam Ito', role: 'Support lead' },
  leo:    { name: 'Leo Brandt', role: 'Product designer' },
  jen:    { name: 'Jen Walsh', role: 'Growth engineer' },
  nora:   { name: 'Nora Diaz', role: 'Data scientist' },
  bob:    { name: 'Bob Okafor', role: 'Browser engineer' },
  mina:   { name: 'Mina Park', role: 'Eng lead, Tabs' },
  tom:    { name: 'Tom Reyes', role: 'Engineer' },
  rae:    { name: 'Rae Singh', role: 'Engineer' },
};

const SEED_SOURCES = [
  { id: 'specs', label: 'Specs folder', path: '~/Documents/Specs', items: 214, mode: 'allow' },
  { id: 'code', label: 'Code checkouts', path: '~/code', items: 602, mode: 'allow' },
  { id: 'desktop', label: 'Desktop', path: '~/Desktop', items: 38, mode: 'allow' },
  { id: 'downloads', label: 'Downloads', path: '~/Downloads', items: 171, mode: 'block' },
  { id: 'drive', label: 'Google Drive', path: 'Drive / team folders', items: 318, mode: 'allow' },
  { id: 'slack', label: 'Slack', path: 'Channels you are in', items: 143, mode: 'allow' },
];

const SEED_STREAMS = [
  { id: 'perm', name: 'Update permissions', status: 'working', desc: 'Move the public API from per-key scopes to four roles, enforced at the gateway.', team: ['alice', 'david', 'priya', 'me'] },
  { id: 'growth', name: 'Run growth experiment', status: 'working', desc: 'A three-step onboarding checklist, tested against the current empty state.', team: ['jen', 'leo', 'nora', 'me'] },
  { id: 'incog', name: 'Adding incognito mode', status: 'working', desc: 'Private windows that save nothing and never contact sync servers.', team: ['david', 'bob', 'me'] },
  { id: 'tabs', name: 'Fixing tabs', status: 'watching', desc: 'Memory-aware tab discarding so 8 GB laptops stop swapping.', team: ['mina', 'tom', 'rae'] },
  { id: 'sso', name: 'Enterprise SSO', status: 'none', desc: 'Let admins sign in with Okta or Azure AD and map groups to the four API roles.', team: ['rae', 'tom'], near: 'Touches the same four API roles as Update permissions.' },
];

const SEED_FILES = [
  { id: 'p4', ws: 'perm', title: 'Architecture review notes', path: 'Drive / Platform / Reviews', owner: 'priya', source: 'drive', passage: 'Decision, Oct 23: enforce roles at the API gateway with a 60-second cache. Services keep a fallback check for admin-only endpoints.' },
  { id: 'p3', ws: 'perm', title: '#platform-api, Oct 24', path: 'Slack / #platform-api', owner: 'priya', source: 'slack', passage: 'Priya: going with gateway checks. David will update the RFC. I am starting the migration script today.' },
  { id: 'p2', ws: 'perm', title: 'RFC-041', path: '~/code/platform/rfcs/', owner: 'david', source: 'code', stale: true, passage: 'Status: Proposed. A decision is pending the architecture review.', replacement: 'Status: Accepted on Oct 23. Roles are enforced at the API gateway with a 60-second cache. Services keep a fallback check for admin-only endpoints.' },
  { id: 'p1', ws: 'perm', title: 'Permissions API PRD', path: '~/Documents/Specs/platform/', owner: 'alice', source: 'specs', passage: 'Replace per-key scopes with four roles: Owner, Admin, Developer, and Read-only. API keys inherit the role of the person who created them.' },
  { id: 'g1', ws: 'growth', title: 'Onboarding checklist brief', path: 'Drive / Growth', owner: 'jen', source: 'drive', passage: 'Hypothesis: a three-step checklist raises week-1 activation from 31% to 36%. The stopping rule is not decided yet.' },
  { id: 'g4', ws: 'growth', title: 'Checklist engineering spec', path: '~/code/growth/docs/', owner: 'jen', source: 'code', passage: 'Step one creates an API key with the sources:write scope for the new workspace.' },
  { id: 'i1', ws: 'incog', title: 'Incognito PRD', path: '~/Documents/Specs/incognito/', owner: 'alice', source: 'specs', stale: true, passage: 'History sync in incognito is on by default and end-to-end encrypted.', replacement: 'Incognito windows never contact sync servers. History sync was cut for Release 1 because encrypted sync still exposes visit timing.' },
  { id: 'i2', ws: 'incog', title: 'Privacy review notes', path: '~/Documents/Specs/incognito/', owner: 'marcus', source: 'specs', passage: 'Encrypted sync still exposes visit timing and device count. Private windows should not contact sync servers.' },
  { id: 'i3', ws: 'incog', title: '#incognito, Oct 22', path: 'Slack / #incognito', owner: 'david', source: 'slack', passage: 'David: we are cutting history sync from incognito for Release 1. Bob already removed the sync hook behind a flag.' },
  { id: 'i5', ws: 'incog', title: 'Incognito engineering notes', path: '~/code/browser/docs/', owner: 'bob', source: 'code', passage: 'Private tabs are never written to disk. A discarded private tab cannot be reloaded, so it is lost.' },
  { id: 't1', ws: 'tabs', title: 'Tab discard RFC', path: '~/code/browser/docs/', owner: 'mina', source: 'code', passage: 'Discard background tabs at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio stay.' },
  { id: 't3', ws: 'tabs', title: 'Tab memory benchmark', path: 'Drive / Browser / Tabs', owner: 'rae', source: 'drive', passage: 'Median 92 MB per background tab. 8 GB devices start swapping at around 52 tabs.' },
  { id: 't2', ws: 'tabs', title: 'tabs readme', path: '~/code/browser/tabs/', owner: 'tom', source: 'code', stale: true, passage: 'Tabs are discarded once 64 tabs are open, regardless of device memory.', replacement: 'Background tabs are discarded at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio are never discarded.' },
  { id: 'sso1', ws: 'sso', title: 'SSO group mapping proposal', path: 'Drive / Enterprise', owner: 'rae', source: 'drive', passage: 'Map identity-provider groups straight to the four API roles: Owner, Admin, Developer, and Read-only.' },
  { id: 'dl1', ws: 'perm', title: 'Legacy scope export', path: '~/Downloads/legacy-scopes.csv', owner: 'alice', source: 'downloads', passage: '142 existing scopes, exported from the legacy admin. Nine scopes have no role.' },
];

const SEED_OVERLAPS = [
  { id: 'o-check', a: 'perm', b: 'growth', title: 'New API roles may break the onboarding checklist', summary: 'Permissions ends per-key scopes on Nov 18. The checklist still creates a key with the sources:write scope, two weeks into the experiment.', askId: 'scope-clash', dismissed: false },
  { id: 'o-tabs', a: 'tabs', b: 'incog', title: 'Discarding tabs could lose private windows', summary: 'Tabs will discard background tabs at 48 open. Private tabs cannot be reloaded from disk, and neither plan says they are exempt.', askId: 'private-tabs', dismissed: false },
];

const SEED_ASKS = [
  { id: 'perm-decision', question: 'What was the final decision on the permissions API?', ws: 'perm', from: 'alice', to: 'me', home: 'me', fallback: 'david', status: 'needs-you', at: 4,
    draft: 'The team enforces roles at the API gateway, with a 60-second cache. Services keep a fallback check for admin-only endpoints. This was decided on Oct 23.',
    cites: ['p4', 'p3'], gap: 'Alice asked you because the RFC still says the decision is pending.', answer: '', answeredBy: '' },
  { id: 'incog-call', question: 'Who decided to cut history sync from incognito?', ws: 'incog', from: 'me', to: 'alice', home: 'alice', fallback: 'marcus', status: 'unsent', at: 0,
    draft: 'You and Marcus Hill decided on Oct 21. History sync is off in incognito for Release 1, because encrypted sync still exposes visit timing.',
    cites: ['i1', 'i2', 'i3'], repairs: 'i1',
    gap: 'The PRD says history sync is on. The Oct 22 thread says it was cut. Nobody wrote down who decided.', answer: '', answeredBy: '' },
  { id: 'growth-stop', question: "What's the stopping rule for the onboarding checklist?", ws: 'growth', from: 'me', to: 'jen', home: 'jen', fallback: 'nora', status: 'unsent', at: 0,
    draft: '', cites: ['g1'],
    gap: 'The experiment brief says the stopping rule is not decided. Jen owns the brief.', answer: '', answeredBy: '' },
  { id: 'scope-clash', question: 'Should the onboarding checklist create a Developer-role key instead of a sources:write scope?', ws: 'growth', from: 'me', to: 'david', home: 'david', fallback: 'alice', status: 'unsent', at: 0,
    draft: 'Yes. The checklist should create a Developer-role key. Per-key scopes end on Nov 18, two weeks into the experiment.',
    cites: ['p1', 'g4'], gap: 'The two plans disagree about how a new key is created.', answer: '', answeredBy: '' },
  { id: 'private-tabs', question: 'Should private tabs be exempt from discarding?', ws: 'tabs', from: 'me', to: 'mina', home: 'mina', fallback: 'bob', status: 'unsent', at: 0,
    draft: 'Yes. Private tabs should be exempt. They cannot be reloaded from disk, so discarding one loses it. Treat them like pinned tabs.',
    cites: ['t1', 'i5'], gap: 'Neither plan says whether private tabs are discarded.', answer: '', answeredBy: '' },
  { id: 'repair-p2', question: 'Can RFC-041 record that the gateway decision is accepted?', ws: 'perm', from: 'me', to: 'david', home: 'david', fallback: 'alice', status: 'unsent', at: 0,
    draft: 'Status: Accepted on Oct 23. Roles are enforced at the API gateway with a 60-second cache. Services keep a fallback check for admin-only endpoints.',
    cites: ['p4', 'p3'], repairs: 'p2', gap: 'RFC-041 still says the decision is pending.', answer: '', answeredBy: '' },
  { id: 'repair-t2', question: 'Can the tabs readme use the memory-aware discard thresholds?', ws: 'tabs', from: 'me', to: 'tom', home: 'tom', fallback: 'mina', status: 'unsent', at: 0,
    draft: 'Background tabs are discarded at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio are never discarded.',
    cites: ['t1', 't3'], repairs: 't2', gap: 'The readme still says a flat 64 tabs.', answer: '', answeredBy: '' },
  { id: 'tabs-known', question: 'When are background tabs discarded?', ws: 'tabs', from: 'leo', to: 'mina', home: 'mina', fallback: 'tom', status: 'known', at: 2,
    draft: 'Background tabs are discarded at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio stay.',
    answer: 'Background tabs are discarded at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio stay.',
    cites: ['t1', 't3'], answeredBy: 'mina', gap: '' },
];

const ROUTES = [
  { test: /stopping rule|onboarding checklist/i, askId: 'growth-stop' },
  { test: /incognito|history sync|private window/i, askId: 'incog-call' },
  { test: /discard|background tabs|tab memory/i, files: 'tabs' },
  { test: /permission|api gateway|per-key scope|architecture review/i, files: 'perm' },
];

const HELP = {
  asking: ['Asking', 'Type a question in the bar. If the files already agree, Index answers and cites the passage. If they do not, Index drafts a card for the person who would know. The same question later is answered from what they confirmed.'],
  cards: ['Cards', 'A card is one question, a drafted answer, and the passages it came from. The person it is for can Confirm, Correct, or say Not me. Confirm files their answer. Correct replaces the draft with what they write. Not me hands the same card to the other person named in it. Nothing is sent to Slack or email.'],
  evidence: ['Evidence', 'A citation opens the passage Index used. It is not a folder to browse. If a source is blocked in Settings, the title can still appear and the passage stays hidden.'],
  overlaps: ['Overlaps', 'An overlap is two plans that disagree. The action on it is a card to the person who can settle it. Dismiss hides it until you undo.'],
  sources: ['Sources', 'Specs, code, Desktop, Drive, and Slack start allowed. Downloads starts blocked. Allow or block each one. Index only reads what you allow.'],
};

const LEGAL = {
  privacy: ['Privacy', 'This prototype keeps everything in the browser tab you have open. Signing out clears the demo back to its sample company. The people, files, and decisions are fictional. A card stays inside Index. It is not an email and it is not a Slack message.'],
  terms: ['Terms', 'Index in this build is a clickable demo. Answers are written ahead of time for a handful of questions about a fictional browser team. Asking anything else lets you send a card with no draft, which the recipient has to fill in.'],
  security: ['Security', 'There is no account server and no file is uploaded. Allow and block only change what this page will show. Close the tab and the session is gone.'],
};

let SOURCES, STREAMS, FILES, OVERLAPS, ASKS, clock;
const state = {
  authed: false, view: 'login', q: '', askId: null, streamId: null, fileId: null,
  helpId: 'asking', legalId: 'privacy', policy: 'ask', notifyCards: true,
  bell: false, correcting: false, composing: false, askError: '', formError: '',
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const first = id => PEOPLE[id].name.split(' ')[0];
const face = id => `<img class="face" src="people/${id}.jpg" alt="">`;
const fileBy = id => FILES.find(f => f.id === id);
const askBy = id => ASKS.find(a => a.id === id);
const streamBy = id => STREAMS.find(s => s.id === id);
const sourceBy = id => SOURCES.find(s => s.id === id);
const readable = file => sourceBy(file.source).mode === 'allow';
const needsMe = () => ASKS.filter(a => a.to === 'me' && a.status === 'needs-you');

function resetData() {
  SOURCES = structuredClone(SEED_SOURCES);
  STREAMS = structuredClone(SEED_STREAMS);
  FILES = structuredClone(SEED_FILES);
  OVERLAPS = structuredClone(SEED_OVERLAPS);
  ASKS = structuredClone(SEED_ASKS);
  clock = 10;
}

function settle(ask) {
  ask.status = 'known';
  ask.answer = ask.draft;
  ask.answeredBy = ask.to;
  ask.at = ++clock;
  if (ask.repairs) {
    const file = fileBy(ask.repairs);
    if (file && file.replacement) {
      file.passage = file.replacement;
      file.stale = false;
    }
  }
}

function passOn(ask) {
  ask.to = ask.to === ask.fallback ? ask.home : ask.fallback;
  if (ask.status === 'unsent') ask.status = 'unsent';
  toast(`Passed to ${PEOPLE[ask.to].name}.`);
}

function interpret(q) {
  const query = q.trim();
  if (!query) return { kind: 'empty' };
  for (const route of ROUTES) {
    if (!route.test.test(query)) continue;
    if (route.askId) {
      const ask = askBy(route.askId);
      if (ask.status === 'known') return { kind: 'memory', ask };
      if (state.policy === 'never') return { kind: 'silent', ask };
      return { kind: 'card', ask };
    }
    return { kind: 'files', route };
  }
  return { kind: 'none' };
}

function filesAnswer(which) {
  if (which === 'perm') {
    const stale = fileBy('p2').stale;
    const yours = askBy('perm-decision').status === 'known' ? ' You already confirmed this for Alice.' : '';
    const tail = stale
      ? ' RFC-041 still says the decision is pending.'
      : ' RFC-041 matches that decision.';
    return {
      html: `The team enforces roles at the API gateway, with a 60-second cache. Services keep a fallback check for admin-only endpoints.${yours}${tail}`,
      cites: ['p4', 'p3', 'p2'],
      repair: stale && state.policy !== 'never' ? 'repair-p2' : null,
      repairLabel: 'Ask David to update RFC-041',
    };
  }
  const stale = fileBy('t2').stale;
  const tail = stale
    ? ' The tabs readme still says a flat 64.'
    : ' The tabs readme matches the RFC.';
  return {
    html: `Background tabs are discarded at 48 open tabs on 8 GB devices and 120 on 16 GB. Pinned tabs and tabs playing audio stay.${tail}`,
    cites: ['t1', 't3', 't2'],
    repair: stale && state.policy !== 'never' ? 'repair-t2' : null,
    repairLabel: 'Ask Tom to update the readme',
  };
}

function clipButtons(ids) {
  if (!ids || !ids.length) return '';
  return `<div class="clips">${ids.map(id => {
    const file = fileBy(id);
    const mark = file.stale ? ' (out of date)' : '';
    return `<button type="button" data-act="open-file" data-arg="${id}">${esc(file.title)}${mark}</button>`;
  }).join('')}</div>`;
}

function tabLabel(ask) {
  if (ask.status === 'known') return '';
  if (ask.status === 'unsent') return 'Ready to send';
  return ask.to === 'me' ? 'Needs you' : `Needs ${first(ask.to)}`;
}

function cardHTML(ask) {
  const open = ask.status !== 'known';
  const where = ask.ws ? `<button type="button" class="text" data-act="open-stream" data-arg="${ask.ws}">${esc(streamBy(ask.ws).name)}</button>` : '<span class="muted">No workstream yet</span>';
  const sentence = ask.status === 'known' ? ask.answer : ask.draft;
  const body = state.correcting && state.askId === ask.id
    ? correctionHTML(ask)
    : `<blockquote class="draft">${sentence ? esc(sentence) : '<span class="muted">No draft yet. The person who knows has to write it.</span>'}</blockquote>`;
  return `<article class="card${open ? ' open' : ''}" aria-labelledby="q-${ask.id}">
    ${open ? `<div class="tab">${esc(tabLabel(ask))}</div>` : ''}
    <p class="from">${face(ask.from)} ${esc(PEOPLE[ask.from].name)} asked</p>
    <p>${where}</p>
    <h2 id="q-${ask.id}" style="font-size:1.35rem;margin:8px 0">${esc(ask.question)}</h2>
    ${body}
    ${clipButtons(ask.cites)}
    ${cardActions(ask)}
    ${state.formError && state.askId === ask.id ? `<p class="problem">${esc(state.formError)}</p>` : ''}
  </article>`;
}

function correctionHTML(ask) {
  const label = ask.status === 'unsent' ? 'Save draft' : 'Save correction';
  return `<form class="stack" data-form="correction" novalidate>
    <label for="correction">${ask.status === 'unsent' ? 'Edit the draft' : 'Correction'}</label>
    <textarea id="correction" placeholder="Write what you know">${esc(ask.draft)}</textarea>
    <div class="actions">
      <button class="btn solid" type="submit">${label}</button>
      <button class="btn" type="button" data-act="cancel-correct">Cancel</button>
    </div>
  </form>`;
}

function cardActions(ask) {
  if (state.correcting && state.askId === ask.id) return '';
  if (ask.status === 'known') return `<p class="filed">${esc(first(ask.answeredBy))} confirmed this.</p>`;
  const banner = ask.to === 'me' ? '' : `<p class="banner">This is ${esc(first(ask.to))}'s card.</p>`;
  if (ask.status === 'unsent') {
    return `${banner}<div class="actions"><button class="btn solid" type="button" data-act="send" data-arg="${ask.id}">Send card to ${esc(first(ask.to))}</button><button class="btn" type="button" data-act="correct" data-arg="${ask.id}">Correct</button></div>`;
  }
  const disabled = ask.draft.trim() ? '' : 'disabled';
  const hint = ask.draft.trim() ? '' : '<p class="hint">There is no draft. Correct it before it can be confirmed.</p>';
  return `${banner}<div class="actions">
    <button class="btn solid" type="button" data-act="confirm" data-arg="${ask.id}" ${disabled}>Confirm</button>
    <button class="btn" type="button" data-act="correct" data-arg="${ask.id}">Correct</button>
    <button class="btn" type="button" data-act="not-me" data-arg="${ask.id}">Not me</button>
  </div>${hint}`;
}

function row(title, sub, act, arg) {
  return `<button class="line" type="button" data-act="${act}" data-arg="${esc(arg)}"><span class="grow"><strong>${esc(title)}</strong><span class="clip">${esc(sub)}</span></span></button>`;
}

function footer() {
  return `<nav class="foot" aria-label="About Index">
    <a href="#help" data-act="help">Help</a>
    <a href="#privacy" data-act="legal" data-arg="privacy">Privacy</a>
    <a href="#terms" data-act="legal" data-arg="terms">Terms</a>
    <a href="#security" data-act="legal" data-arg="security">Security</a>
  </nav>`;
}

function renderLogin() {
  return `<div class="login">
    <div class="login-copy">
      <p class="brand" style="margin-bottom:28px"><img src="icons/logo.svg" alt="" style="height:22px"> Index</p>
      <h1>The fact that isn't in the files.</h1>
      <p class="lede">Index reads what the teams already wrote. When that is not enough, one person gets a card with a draft. They confirm it, correct it, or pass it on.</p>
      <article class="card open" aria-hidden="true">
        <div class="tab">Needs Alice</div>
        <p class="from">${face('me')} You asked</p>
        <h2 style="font-size:1.2rem">Who decided to cut history sync from incognito?</h2>
        <blockquote class="draft">You and Marcus Hill decided on Oct 21. History sync is off in incognito for Release 1, because encrypted sync still exposes visit timing.</blockquote>
        <p class="muted">Confirm, correct, or pass it on.</p>
      </article>
    </div>
    <div class="login-side">
      <h2 style="margin-top:0;font-size:1.3rem">Sign in</h2>
      <p class="muted">Use a work account. This demo signs in locally.</p>
      <div class="sso">
        <button class="btn" type="button" data-act="signin" data-arg="google">Continue with Google</button>
        <button class="btn" type="button" data-act="signin" data-arg="sso">Continue with SSO</button>
      </div>
      <form class="stack" data-form="email" novalidate style="margin-top:16px">
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="off" placeholder="you@company.com">
        <button class="btn solid" type="submit">Continue with email</button>
        ${state.formError ? `<p class="problem">${esc(state.formError)}</p>` : ''}
      </form>
    </div>
  </div>`;
}

function renderHome() {
  const waiting = ASKS.filter(a => a.from === 'me' && a.status === 'waiting');
  const known = ASKS.filter(a => a.status === 'known').sort((a, b) => b.at - a.at);
  const mine = STREAMS.filter(s => s.status === 'working' || s.status === 'watching');
  const near = STREAMS.filter(s => s.status === 'none');
  const openOv = OVERLAPS.filter(o => !o.dismissed && askBy(o.askId).status !== 'known');
  const doneOv = OVERLAPS.filter(o => o.dismissed || askBy(o.askId).status === 'known');
  return `<div class="wrap">
    <section id="needs">
      <h2>Needs you</h2>
      ${needsMe().length ? needsMe().map(cardHTML).join('') : '<p class="muted">Nothing is waiting on you.</p>'}
    </section>
    <section id="waiting">
      <h2>Waiting on someone</h2>
      ${waiting.length ? waiting.map(a => row(a.question, `With ${PEOPLE[a.to].name}`, 'open-ask', a.id)).join('') : '<p class="muted">You have not sent a card.</p>'}
    </section>
    <section id="known">
      <h2>Known</h2>
      ${known.length ? known.map(a => row(a.question, a.answer, 'open-ask', a.id)).join('') : '<p class="muted">Nothing is filed yet.</p>'}
    </section>
    <section id="overlaps">
      <h2>Overlaps</h2>
      ${openOv.map(overlapHTML).join('') || '<p class="muted">No open overlaps.</p>'}
      ${doneOv.map(o => `<p class="muted">${esc(o.title)}. ${o.dismissed ? `<button type="button" class="text" data-act="undo" data-arg="${o.id}" aria-label="Undo ${o.id === 'o-check' ? 'the checklist overlap' : 'the private tabs overlap'}">Undo dismiss</button>` : 'Settled.'}</p>`).join('')}
    </section>
    <section id="nearby">
      <h2>Nearby</h2>
      ${near.length ? near.map(s => `<div class="item"><strong>${esc(s.name)}</strong><p class="clip">${esc(s.near || s.desc)}</p><button class="btn" type="button" data-act="watch" data-arg="${s.id}">Watch ${esc(s.name)}</button></div>`).join('') : '<p class="muted">No nearby workstreams.</p>'}
    </section>
    <section id="streams">
      <h2>Your workstreams</h2>
      ${mine.map(s => row(s.name, s.status === 'working' ? 'Working' : 'Watching', 'open-stream', s.id)).join('')}
      ${state.composing ? `<form class="stack" data-form="new-stream" novalidate style="margin-top:12px">
        <label for="ws-name">Name</label>
        <input id="ws-name" autocomplete="off">
        <label for="ws-desc">What it is for</label>
        <input id="ws-desc" autocomplete="off">
        <div class="actions">
          <button class="btn solid" type="submit">Create workstream</button>
          <button class="btn" type="button" data-act="cancel-new">Cancel</button>
        </div>
        ${state.formError ? `<p class="problem">${esc(state.formError)}</p>` : ''}
      </form>` : '<p><button class="text" type="button" data-act="new-stream">New workstream</button></p>'}
    </section>
    ${footer()}
  </div>`;
}

function overlapHTML(o) {
  const ask = askBy(o.askId);
  const label = o.id === 'o-check' ? 'Ask David about the checklist' : 'Ask Mina about private tabs';
  const dismiss = o.id === 'o-check' ? 'Dismiss the checklist overlap' : 'Dismiss the private tabs overlap';
  return `<div class="item"><strong>${esc(o.title)}</strong><p class="clip">${esc(o.summary)}</p>
    <div class="actions">
      <button class="btn solid" type="button" data-act="open-ask" data-arg="${ask.id}">${label}</button>
      <button class="btn" type="button" data-act="dismiss" data-arg="${o.id}" aria-label="${dismiss}">Dismiss</button>
    </div></div>`;
}

function renderAsk() {
  const found = interpret(state.q);
  let body = '';
  if (found.kind === 'memory') {
    const ask = found.ask;
    body = `<blockquote class="draft">${esc(ask.answer)}</blockquote>
      <p class="filed">${esc(first(ask.answeredBy))} confirmed this, so Index didn't ask again.</p>
      ${clipButtons(ask.cites)}`;
  } else if (found.kind === 'silent') {
    body = `<p class="gap">${esc(found.ask.gap)}</p>
      <p>Asking people is off. Turn it on in Settings if this should become a card.</p>
      ${clipButtons(found.ask.cites)}
      <p><button class="btn" type="button" data-act="settings">Settings</button></p>`;
  } else if (found.kind === 'card') {
    body = `<p class="gap">${esc(found.ask.gap)}</p>${cardHTML(found.ask)}`;
  } else if (found.kind === 'files') {
    const ans = filesAnswer(found.route.files);
    body = `<blockquote class="draft">${esc(ans.html)}</blockquote>
      ${clipButtons(ans.cites)}
      <p class="filed">From the files.</p>
      ${ans.repair ? `<p><button class="btn solid" type="button" data-act="open-ask" data-arg="${ans.repair}">${esc(ans.repairLabel)}</button></p>` : ''}`;
  } else {
    const options = Object.keys(PEOPLE).filter(id => id !== 'me').map(id => `<option value="${id}">${esc(PEOPLE[id].name)}</option>`).join('');
    body = `<p>Nothing in the allowed sources answers this.</p>
      ${state.policy === 'never'
        ? '<p>Asking people is off. Turn it on in Settings to send a card.</p><p><button class="btn" type="button" data-act="settings">Settings</button></p>'
        : `<form class="stack" data-form="ask-person" novalidate>
            <label for="who">Who should answer this?</label>
            <select id="who" aria-label="Who should answer this">${options}</select>
            <button class="btn solid" type="submit">Ask them</button>
          </form>`}`;
  }
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    <h1>${esc(state.q)}</h1>
    ${body}
    ${footer()}
  </div>`;
}

function renderCard() {
  const ask = askBy(state.askId);
  if (!ask) return renderHome();
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    ${cardHTML(ask)}
    ${footer()}
  </div>`;
}

function renderStream() {
  const stream = streamBy(state.streamId);
  if (!stream) return renderHome();
  const known = ASKS.filter(a => a.ws === stream.id && a.status === 'known');
  const open = ASKS.filter(a => a.ws === stream.id && a.status !== 'known' && (a.status !== 'unsent' || a.from === 'me'));
  const files = FILES.filter(f => f.ws === stream.id);
  const ovs = OVERLAPS.filter(o => o.a === stream.id || o.b === stream.id);
  const watchLabel = stream.status === 'watching' ? 'Stop watching' : 'Watch';
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    <p class="muted">${stream.status === 'working' ? 'Working' : stream.status === 'watching' ? 'Watching' : 'Nearby'}</p>
    <h1>${esc(stream.name)}</h1>
    <p>${esc(stream.desc)}</p>
    ${stream.near ? `<p>${esc(stream.near)}</p>` : ''}
    ${stream.status === 'working' ? '' : `<p><button class="btn" type="button" data-act="watch" data-arg="${stream.id}">${watchLabel}</button></p>`}
    <h2>People</h2>
    ${stream.team.map(id => `<p class="from">${face(id)} ${esc(PEOPLE[id].name)} <span class="muted">${esc(PEOPLE[id].role)}</span></p>`).join('')}
    <h2>Filed here</h2>
    ${known.length ? known.map(a => row(a.question, a.answer, 'open-ask', a.id)).join('') : '<p class="muted">Nothing is filed here yet. An answer Index saves is filed on its workstream.</p>'}
    <h2>Open cards</h2>
    ${open.length ? open.map(a => row(a.question, tabLabel(a), 'open-ask', a.id)).join('') : '<p class="muted">No open cards.</p>'}
    <h2>Evidence</h2>
    <div class="ev-list">${files.map(f => `<p><button type="button" class="title" data-act="open-file" data-arg="${f.id}">${esc(f.title)}</button> <span class="muted">${f.stale ? 'Out of date' : esc(PEOPLE[f.owner].name)}</span></p>`).join('') || '<p class="muted">No evidence yet.</p>'}</div>
    ${ovs.length ? `<h2>Overlaps</h2>${ovs.map(o => `<p>${esc(o.title)}</p>`).join('')}` : ''}
    ${footer()}
  </div>`;
}

function renderSettings() {
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    <h1>Settings</h1>
    <h2>Sources</h2>
    <ul class="stack" style="list-style:none;padding:0">
      ${SOURCES.map(s => `<li class="src">
        <label><input type="checkbox" name="source" data-arg="${s.id}" ${s.mode === 'allow' ? 'checked' : ''}> ${esc(s.label)}</label>
        <span class="muted">${esc(s.path)}</span>
        ${s.id === 'downloads' ? '<button class="btn preview" type="button" data-act="open-file" data-arg="dl1">Preview Legacy scope export</button>' : ''}
      </li>`).join('')}
    </ul>
    <h2>Asking</h2>
    <div class="stack">
      <label><input type="radio" name="policy" value="ask" ${state.policy === 'ask' ? 'checked' : ''}> Ask the owner with a card</label>
      <label><input type="radio" name="policy" value="never" ${state.policy === 'never' ? 'checked' : ''}> Don't ask people</label>
    </div>
    <h2>Notifications</h2>
    <label><input type="checkbox" name="alerts" ${state.notifyCards ? 'checked' : ''}> Show cards that need you on the bell</label>
    <h2>Profile</h2>
    <p class="from">${face('me')} You <span class="muted">Product manager</span></p>
    <p><button class="btn" type="button" data-act="signout">Sign out</button></p>
    ${footer()}
  </div>`;
}

function renderHelp() {
  const [title, body] = HELP[state.helpId] || HELP.asking;
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    <h1>Help</h1>
    <div class="actions" role="group" aria-label="Help topics">
      ${Object.entries(HELP).map(([id, [label]]) => `<button class="btn${id === state.helpId ? ' solid' : ''}" type="button" data-act="help" data-arg="${id}" aria-pressed="${id === state.helpId}">${label}</button>`).join('')}
    </div>
    <h2>${esc(title)}</h2>
    <p>${esc(body)}</p>
    ${footer()}
  </div>`;
}

function renderLegal() {
  const [title, body] = LEGAL[state.legalId] || LEGAL.privacy;
  return `<div class="wrap">
    <p><button class="text" type="button" data-act="home">Back to home</button></p>
    <h1>${esc(title)}</h1>
    <p>${esc(body)}</p>
    ${footer()}
  </div>`;
}

function fileOverlay() {
  if (!state.fileId) return '';
  const file = fileBy(state.fileId);
  if (!file) return '';
  const open = readable(file);
  return `<div class="scrim" data-scrim>
    <article class="evidence" role="dialog" aria-modal="true" aria-labelledby="ev-title">
      <p><button class="btn" type="button" data-act="close-file" aria-label="Close evidence">Close</button></p>
      <p class="muted">${esc(file.path)}</p>
      <h2 id="ev-title">${esc(file.title)}</h2>
      <p class="from">${face(file.owner)} ${esc(PEOPLE[file.owner].name)}</p>
      ${file.stale ? '<p class="problem">Out of date</p>' : ''}
      ${open ? `<p class="passage">${esc(file.passage)}</p>` : `<p class="blocked">Index can't open this. ${esc(sourceBy(file.source).label)} is blocked in Sources.</p>`}
    </article>
  </div>`;
}

function bellHTML() {
  if (!state.notifyCards) return '<p>Card alerts are off. Cards that need you still show on the home page.</p>';
  const items = needsMe();
  if (!items.length) return '<p>Nothing needs you.</p>';
  return items.map(a => `<button type="button" data-act="open-ask" data-arg="${a.id}">${esc(a.question)}</button>`).join('');
}

function render() {
  document.body.classList.toggle('in', state.authed);
  document.body.classList.toggle('modal', Boolean(state.fileId));
  const view = !state.authed ? 'login'
    : state.view === 'ask' ? 'ask'
    : state.view === 'card' ? 'card'
    : state.view === 'stream' ? 'stream'
    : state.view === 'settings' ? 'settings'
    : state.view === 'help' ? 'help'
    : state.view === 'legal' ? 'legal'
    : 'home';
  state.view = state.authed ? view : 'login';
  const html = {
    login: renderLogin, home: renderHome, ask: renderAsk, card: renderCard,
    stream: renderStream, settings: renderSettings, help: renderHelp, legal: renderLegal,
  }[state.view]();
  $('app').innerHTML = html + fileOverlay();
  const err = $('ask-error');
  err.hidden = !state.askError;
  err.textContent = state.askError || '';
  const q = $('q');
  if (q && document.activeElement !== q) q.value = state.q || '';
  if (q) q.setAttribute('aria-invalid', state.askError ? 'true' : 'false');
  const n = needsMe().length;
  const count = $('bell-count');
  count.hidden = !state.authed || !state.notifyCards || n === 0;
  count.textContent = String(n);
  const bell = $('bell');
  bell.setAttribute('aria-expanded', state.bell ? 'true' : 'false');
  const pop = $('bell-pop');
  pop.hidden = !state.bell;
  pop.innerHTML = state.bell ? bellHTML() : '';
  document.title = state.view === 'login' ? 'Sign in · Index' : 'Index';
  const problems = audit();
  window.__auditErrors = problems;
  if (problems.length) console.error('Index audit', problems);
}

function toast(message) {
  const el = $('toast');
  el.hidden = false;
  el.textContent = message;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 3200);
}

function go(view, extra = {}) {
  state.view = view;
  state.askError = '';
  state.formError = '';
  state.bell = false;
  state.fileId = null;
  if (!extra.keepCorrecting) state.correcting = false;
  if (!extra.keepComposing) state.composing = false;
  Object.assign(state, extra);
  render();
}

function onAct(act, arg) {
  if (act === 'signin') {
    state.authed = true;
    state.formError = '';
    go('home');
    return;
  }
  if (act === 'signout') {
    resetData();
    state.authed = false;
    state.q = '';
    state.policy = 'ask';
    state.notifyCards = true;
    state.view = 'login';
    state.askError = '';
    state.formError = '';
    state.bell = false;
    state.fileId = null;
    state.correcting = false;
    state.composing = false;
    render();
    return;
  }
  if (act === 'home') { state.q = ''; go('home'); return; }
  if (act === 'settings') { go('settings'); return; }
  if (act === 'help') { go('help', { helpId: arg || state.helpId }); return; }
  if (act === 'legal') { go('legal', { legalId: arg || 'privacy' }); return; }
  if (act === 'bell') { state.bell = !state.bell; render(); return; }
  if (act === 'open-ask') { go('card', { askId: arg }); return; }
  if (act === 'open-stream') { go('stream', { streamId: arg }); return; }
  if (act === 'open-file') {
    state.fileId = arg;
    state.bell = false;
    render();
    document.querySelector('[aria-label="Close evidence"]')?.focus();
    return;
  }
  if (act === 'close-file') { state.fileId = null; render(); return; }
  if (act === 'send') {
    const ask = askBy(arg);
    ask.status = 'waiting';
    state.askId = ask.id;
    state.correcting = false;
    toast(`Sent to ${first(ask.to)}.`);
    go('card', { askId: ask.id });
    return;
  }
  if (act === 'confirm') {
    const ask = askBy(arg);
    if (!ask.draft.trim()) {
      state.formError = 'There is no draft to confirm. Correct it first.';
      state.askId = ask.id;
      render();
      return;
    }
    settle(ask);
    state.askId = ask.id;
    toast(ask.repairs ? `${first(ask.answeredBy)} confirmed the edit.` : 'Confirmed. Index saved the answer.');
    go('card', { askId: ask.id });
    return;
  }
  if (act === 'correct') {
    state.correcting = true;
    state.askId = arg;
    state.formError = '';
    state.view = state.view === 'ask' ? 'ask' : 'card';
    render();
    $('correction')?.focus();
    return;
  }
  if (act === 'cancel-correct') { state.correcting = false; state.formError = ''; render(); return; }
  if (act === 'not-me') {
    const ask = askBy(arg);
    passOn(ask);
    state.askId = ask.id;
    go('card', { askId: ask.id });
    return;
  }
  if (act === 'watch') {
    const stream = streamBy(arg);
    stream.status = stream.status === 'none' ? 'watching' : 'none';
    if (stream.status === 'watching' && !stream.team.includes('me')) stream.team.push('me');
    render();
    return;
  }
  if (act === 'dismiss') {
    OVERLAPS.find(o => o.id === arg).dismissed = true;
    render();
    return;
  }
  if (act === 'undo') {
    OVERLAPS.find(o => o.id === arg).dismissed = false;
    render();
    return;
  }
  if (act === 'new-stream') { state.composing = true; state.formError = ''; render(); return; }
  if (act === 'cancel-new') { state.composing = false; state.formError = ''; render(); return; }
}

function onSubmit(name, form) {
  if (name === 'ask') {
    const q = form.querySelector('input').value.trim();
    if (!q) {
      state.askError = 'Write a question first.';
      render();
      $('q').focus();
      return;
    }
    state.q = q;
    state.askError = '';
    go('ask');
    return;
  }
  if (name === 'email') {
    const email = form.querySelector('input').value.trim();
    if (!email.includes('@') || email.startsWith('@') || email.endsWith('@')) {
      state.formError = 'Enter a work email.';
      render();
      $('email')?.focus();
      return;
    }
    state.authed = true;
    state.formError = '';
    go('home');
    return;
  }
  if (name === 'correction') {
    const ask = askBy(state.askId);
    const text = form.querySelector('textarea').value.trim();
    if (!text) {
      state.formError = 'Write the correction first.';
      render();
      $('correction')?.focus();
      return;
    }
    ask.draft = text;
    state.formError = '';
    state.correcting = false;
    if (ask.status === 'unsent') {
      toast('Draft saved.');
      render();
      return;
    }
    settle(ask);
    toast('Saved the correction. Index will use it from now on.');
    state.view = 'card';
    render();
    return;
  }
  if (name === 'ask-person') {
    const who = form.querySelector('select').value;
    const id = 'ad-' + (++clock);
    ASKS.unshift({
      id, question: state.q, ws: null, from: 'me', to: who, home: who,
      fallback: who === 'alice' ? 'david' : 'alice', status: 'unsent', at: clock,
      draft: '', cites: [], gap: 'Nothing in the allowed sources answers this.', answer: '', answeredBy: '',
    });
    go('card', { askId: id });
    return;
  }
  if (name === 'new-stream') {
    const nameValue = form.querySelector('#ws-name').value.trim();
    const desc = form.querySelector('#ws-desc').value.trim();
    if (!nameValue) {
      state.formError = 'Name the workstream first.';
      state.composing = true;
      render();
      $('ws-name')?.focus();
      return;
    }
    const id = 'ws-' + (++clock);
    STREAMS.push({ id, name: nameValue, status: 'working', desc: desc || 'No description yet.', team: ['me'] });
    go('stream', { streamId: id });
  }
}

function audit() {
  const errors = [];
  const askIds = new Set();
  for (const ask of ASKS) {
    if (askIds.has(ask.id)) errors.push('dup ask ' + ask.id);
    askIds.add(ask.id);
    if (!PEOPLE[ask.from] || !PEOPLE[ask.to] || !PEOPLE[ask.fallback] || !PEOPLE[ask.home]) errors.push('person ' + ask.id);
    if (!['unsent', 'needs-you', 'waiting', 'known'].includes(ask.status)) errors.push('status ' + ask.id);
    if (ask.status === 'known' && !ask.answer) errors.push('empty known ' + ask.id);
    if (ask.ws && !streamBy(ask.ws)) errors.push('ws ' + ask.id);
    for (const citeId of ask.cites || []) if (!fileBy(citeId)) errors.push('cite ' + citeId);
    if (ask.repairs && !fileBy(ask.repairs)) errors.push('repair ' + ask.repairs);
  }
  for (const file of FILES) {
    if (!streamBy(file.ws) || !PEOPLE[file.owner] || !sourceBy(file.source)) errors.push('file ' + file.id);
    if (file.stale && !file.replacement) errors.push('stale ' + file.id);
  }
  for (const stream of STREAMS) {
    for (const id of stream.team) if (!PEOPLE[id]) errors.push('team ' + id);
  }
  for (const overlap of OVERLAPS) if (!askBy(overlap.askId)) errors.push('overlap ' + overlap.id);
  document.querySelectorAll('button, a').forEach(el => {
    const name = el.getAttribute('aria-label') || el.textContent.replace(/\s+/g, ' ').trim();
    if (!name && !el.closest('[aria-hidden="true"]')) errors.push('nameless control');
  });
  document.querySelectorAll('img').forEach(img => {
    if (!img.hasAttribute('alt')) errors.push('img missing alt');
  });
  return errors;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (e.target.hasAttribute && e.target.hasAttribute('data-scrim')) {
    state.fileId = null;
    render();
    return;
  }
  if (!el) {
    if (state.bell && !e.target.closest('#bell') && !e.target.closest('#bell-pop')) {
      state.bell = false;
      render();
    }
    return;
  }
  if (el.tagName === 'A') e.preventDefault();
  onAct(el.dataset.act, el.dataset.arg || '');
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  onSubmit(form.dataset.form, form);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'policy') { state.policy = t.value; render(); }
  if (t.name === 'alerts') { state.notifyCards = t.checked; render(); }
  if (t.name === 'source') {
    sourceBy(t.dataset.arg).mode = t.checked ? 'allow' : 'block';
    render();
  }
});

document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
  if (e.key === '/' && state.authed && !typing) {
    e.preventDefault();
    $('q').focus();
  }
  if (e.key === 'Escape') {
    if (state.fileId) { state.fileId = null; render(); }
    else if (state.bell) { state.bell = false; render(); }
    else if (state.correcting) { state.correcting = false; state.formError = ''; render(); }
  }
});

window.__audit = audit;
resetData();
render();
</script>
</body>
