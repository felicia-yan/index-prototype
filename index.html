<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<meta name="description" content="Cross-team knowledge that keeps itself up to date.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: sticky app bar with search and tools; content in a centered column below; site footer at the bottom.
   Light only, by request. */
:root {
  color-scheme: light;
  --paper: #F7F7F8;
  --grid: rgba(120, 120, 135, .07);
  --card: #FFFFFF;
  --card-line: #E4E4E8;
  --card-line-strong: #D4D4DA;
  --tint: #FAFAFB;
  --sheet: #FFFFFF;
  --sheet-back: #F3F3F5;
  --sheet-line: #C9C9D1;
  --ink: #18181B;
  --muted: #64646E;
  --faint: #9D9DA7;
  --hair: #EEEEF1;
  --hover: #F1F1F4;
  --accent: #232FD3;
  --accent-hover: #1C26B4;
  --accent-soft: #ECEDFD;
  --working-bg: #DCE5FF; --working-fg: #232FD3;
  --watching-bg: #EDEDF0; --watching-fg: #64646E;
  --ok: #1E8656; --ok-soft: #E5F4EC;
  --warn: #A3610A; --warn-soft: #FBF2E1;
  --bad: #C2353A; --bad-soft: #FCEAEB;
  --r: 10px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 16, 24, .04);
  --shadow-lift: 0 12px 32px rgba(16, 16, 24, .10), 0 2px 6px rgba(16, 16, 24, .05);
  --font-ui: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; min-height: 100vh; display: flex; flex-direction: column;
  color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 11.5px; }

.shell { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* App bar */
.top { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .9); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--card-line); }
.top-in { max-width: 1280px; margin: 0 auto; min-height: 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 17px; font-weight: 500; letter-spacing: -0.01em; background: none; border: 0; padding: 0; flex: none; }
.brand img { width: 16px; height: 23px; }
.searchrow { flex: 1; min-width: 0; display: flex; justify-content: center; gap: 8px; }
.search { width: min(560px, 100%); height: 38px; display: flex; align-items: center; background: var(--tint); border: 1px solid var(--card-line); border-radius: 8px; transition: border-color .15s, box-shadow .15s, background .15s; }
.search .glass { width: 17px; height: 17px; margin-left: 12px; flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; padding: 0 10px; font-size: 13.5px; }
.search input::placeholder { color: var(--faint); }
.search kbd { font-family: var(--font-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--card-line); border-radius: 4px; padding: 1px 6px; margin-right: 10px; background: var(--card); }
.search:focus-within { background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search:focus-within kbd { display: none; }
.tools { display: flex; gap: 4px; flex: none; }
.iconbtn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--muted); position: relative; }
.iconbtn:hover, .iconbtn[aria-expanded="true"] { color: var(--ink); background: var(--hover); }
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn.boxed { border: 1px solid var(--card-line); background: var(--tint); }
.iconbtn.boxed:hover, .iconbtn.boxed[aria-expanded="true"] { background: var(--card); border-color: var(--card-line-strong); }
.iconbtn.boxed svg { width: 17px; height: 17px; }
.iconbtn .badge { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }
.iconbtn .count { position: absolute; top: 3px; right: 1px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; box-shadow: 0 0 0 2px #fff; }

.pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 268px; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); box-shadow: var(--shadow-lift); padding: 14px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
.pop h4 { margin: 0; font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .07em; text-transform: uppercase; }
.pop label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.pop input[type="checkbox"], .pop input[type="radio"], .settings input[type="checkbox"] { accent-color: var(--accent); }
.pop .grp { display: flex; flex-direction: column; gap: 7px; }
.popwrap { position: relative; }
.menu { padding: 6px; gap: 0; width: 248px; }
.menu .me-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px; border-bottom: 1px solid var(--hair); margin-bottom: 4px; }
.menu .me-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.menu .me-row small { display: block; color: var(--muted); font-size: 12px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r-sm); padding: 8px 10px; font-size: 13.5px; color: var(--ink); }
.menu button:hover { background: var(--hover); }
.menu button svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.menu button:hover svg { color: var(--ink); }
.menu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 0; }

/* Home */
.home { display: flex; flex-direction: column; gap: 52px; }
.home h2 { font-size: 15px; font-weight: 500; margin: 0 0 18px; display: flex; align-items: center; gap: 12px; }
.home h2 small { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 34px 20px; padding-top: 11px; }

.ws { position: relative; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); box-shadow: var(--shadow); min-height: 290px; padding: 36px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s; }
.ws:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--card-line-strong); }
.status { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); padding: 6px 10px 5px; border-radius: 5px; font-size: 11.5px; font-weight: 500; letter-spacing: .08em; line-height: 1; white-space: nowrap; }
.status.working { background: var(--working-bg); color: var(--working-fg); }
.status.watching { background: var(--watching-bg); color: var(--watching-fg); }
.ws h3 { margin: 0; font-size: 16.5px; font-weight: 500; text-wrap: balance; letter-spacing: -0.005em; }
.faces { display: flex; justify-content: center; }
.face { width: 28px; height: 28px; border-radius: 50%; margin-left: -7px; object-fit: cover; border: 2px solid var(--card); background: var(--sheet-back); display: block; flex: none; }
.faces .face:first-child { margin-left: 0; }
.faces.lg .face { width: 36px; height: 36px; margin-left: -9px; }
.faces.lg .face:first-child { margin-left: 0; }
.ws .meta { margin-top: auto; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ws .meta .alert { color: var(--warn); }
.ws .meta .you { color: var(--accent); }
.ws .empty { margin: auto 0; color: var(--faint); font-size: 14.5px; }

/* Document stack: tight at rest, fans out on hover */
.stack { position: relative; width: 100%; height: 142px; margin-top: 10px; }
.sheet { position: absolute; top: 6px; left: 50%; width: 82px; height: 118px; margin-left: -41px; background: var(--sheet); border: 1px solid var(--sheet-line); border-radius: 3px; padding: 8px 7px; text-align: left; font-size: 9.5px; line-height: 1.3; overflow: hidden; color: var(--ink);
  transform-origin: 50% 100%; transition: transform .32s cubic-bezier(.2,.8,.2,1), translate .2s, box-shadow .2s, border-color .2s, background .2s; box-shadow: 0 1px 3px rgba(16,16,24,.07); }
.sheet b { display: block; font-size: 10.5px; font-weight: 500; margin-bottom: 3px; line-height: 1.2; }
.sheet .k { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--faint); text-transform: uppercase; margin-bottom: 3px; letter-spacing: .04em; }
.sheet .t { color: var(--muted); }
.sheet.behind { background: var(--sheet-back); border-color: var(--card-line-strong); }
.sheet.behind .t, .sheet.behind b, .sheet.behind .k { opacity: 0; transition: opacity .2s; }
.sheet.s1 { transform: rotate(-5deg) translateX(-14px); z-index: 1; }
.sheet.s3 { transform: rotate(5deg) translateX(14px); z-index: 1; }
.sheet.s2 { z-index: 3; }
/* On hover the pages line up flat, side by side, all styled like the front page */
.ws:hover .sheet { transform: none; background: var(--sheet); border-color: var(--sheet-line); }
.ws:hover .sheet.s1 { transform: translateX(-88px); }
.ws:hover .sheet.s3 { transform: translateX(88px); }
.ws:hover .stack.n2 .sheet.s1 { transform: translateX(-44px); }
.ws:hover .stack.n2 .sheet.s2 { transform: translateX(44px); }
.ws:hover .sheet.behind .t, .ws:hover .sheet.behind b, .ws:hover .sheet.behind .k { opacity: 1; }
.ws .sheet:hover { border-color: var(--accent); box-shadow: 0 8px 18px rgba(35,47,211,.16); z-index: 4; translate: 0 -6px; }
.stack-hint { font-size: 11px; color: var(--faint); opacity: 0; transition: opacity .2s; margin-top: -2px; }
.ws:hover .stack-hint { opacity: 1; }

.ws.create { background: transparent; border: 1.5px dashed var(--card-line-strong); box-shadow: none; justify-content: center; color: var(--faint); font-size: 15px; gap: 14px; }
.ws.create img { width: 36px; height: 36px; transition: transform .2s; }
.ws.create:hover { color: var(--accent); border-color: var(--accent); background: var(--card); }
.ws.create:hover img { transform: rotate(90deg); }

/* Notifications panel */
.pop.notif { width: min(400px, calc(100vw - 32px)); padding: 0; gap: 0; max-height: min(660px, calc(100vh - 84px)); overflow: hidden; right: -46px; }
.notif-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.notif-h h3 { margin: 0; font-size: 14px; font-weight: 500; flex: 1; }
.notif-h span { color: var(--faint); font-size: 12px; }
.pop.notif .inbox { overflow-y: auto; min-height: 0; flex: 1; }
.inbox { display: flex; flex-direction: column; }
.note { padding: 16px 18px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 10px; }
.note:first-child { border-top: 0; }
.note .where { color: var(--faint); font-size: 12px; background: none; border: 0; padding: 0; text-align: left; align-self: flex-start; }
.note .where:hover { color: var(--accent); }
.note .who { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
.note .who .face { width: 26px; height: 26px; margin: 0; border: 0; }
.note .who small { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: auto; }
.note .msg { margin: 0; font-size: 13.5px; line-height: 1.5; }
.note .row { display: flex; gap: 8px; flex-wrap: wrap; }
.note textarea { width: 100%; min-height: 72px; border: 1px solid var(--card-line); border-radius: var(--r-sm); background: var(--tint); padding: 9px 10px; resize: vertical; font-size: 13.5px; }
.note .done { color: var(--ok); font-size: 13px; }
.idx { width: 26px; height: 26px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 50%; flex: none; }
.idx img { width: 12px; height: 17px; }

.btn { border: 1px solid var(--card-line-strong); background: var(--card); border-radius: var(--r-sm); padding: 6px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); transition: background .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--hover); border-color: var(--card-line-strong); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); box-shadow: none; }
.btn.ghost:hover { color: var(--ink); background: var(--hover); }

.cite { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 500; vertical-align: 2px; margin-left: 2px; border: 0; }
button.cite:hover { background: var(--accent); color: #fff; }
.diff { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.diff del { background: var(--bad-soft); color: var(--bad); padding: 4px 7px; border-radius: 4px; }
.diff ins { background: var(--ok-soft); color: var(--ok); padding: 4px 7px; border-radius: 4px; text-decoration: none; }

/* Pages */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 13.5px; align-self: flex-start; }
.back:hover { color: var(--accent); }
.page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.panel > header { padding: 14px 18px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel > header h3 { margin: 0; font-size: 14px; font-weight: 500; }
.panel > header span { color: var(--faint); font-size: 12px; }
.panel .body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }

.q-head h1 { margin: 6px 0 0; font-size: 28px; font-weight: 500; letter-spacing: -0.015em; text-wrap: balance; }
.q-head .scope { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--card-line-strong); background: var(--card); }
.pill button { border: 0; background: none; padding: 0; color: var(--faint); }
.pill button:hover { color: var(--bad); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--card-line-strong); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font-size: 13.5px; margin-bottom: -1px; }
.tabs button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.tabs button span { color: var(--faint); font-size: 12px; margin-left: 4px; }

.answer .body p { margin: 0; font-size: 15.5px; line-height: 1.6; max-width: 70ch; }
.trace { color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 5px; }
.trace .line { display: flex; gap: 8px; align-items: baseline; }
.trace .line i { font-style: normal; width: 14px; flex: none; color: var(--ok); }
.trace .line.run i { color: var(--accent); }
.trace .line.ask i { color: var(--warn); }
.trace .line.skip { color: var(--bad); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
details.how summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
details.how summary:hover { color: var(--accent); }
details.how[open] summary { margin-bottom: 8px; }
.askbox { background: var(--warn-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.askbox p { margin: 0; }
.askbox textarea { width: 100%; min-height: 60px; border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); background: var(--card); padding: 8px 10px; }
.conf { font-size: 11.5px; padding: 2px 8px; font-weight: 500; background: var(--ok-soft); color: var(--ok); }
.conf.mid { background: var(--warn-soft); color: var(--warn); }
.repair { border: 1px solid var(--hair); border-radius: 8px; background: var(--tint); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.repair strong { font-weight: 500; }

.results { display: flex; flex-direction: column; }
.result { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; padding: 16px 18px; border-top: 1px solid var(--hair); align-items: start; }
.result:first-child { border-top: 0; }
.result:hover { background: var(--tint); }
.ftype { width: 34px; height: 42px; border: 1px solid var(--sheet-line); background: var(--sheet); display: grid; place-items: end center; padding-bottom: 4px; font-family: var(--font-mono); font-size: 8.5px; text-transform: uppercase; }
.ftype.t-pdf { border-color: var(--bad); color: var(--bad); }
.ftype.t-doc { border-color: var(--accent); color: var(--accent); }
.ftype.t-slack { border-color: var(--muted); color: var(--muted); }
.ftype.t-csv { border-color: var(--ok); color: var(--ok); }
.ftype.t-fig { border-color: var(--warn); color: var(--warn); }
.result .t { font-size: 15px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; text-align: left; }
.result .t:hover { text-decoration: underline; text-underline-offset: 3px; }
.result .p { color: var(--faint); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .snip { margin: 6px 0 0; color: var(--ink); font-size: 13.5px; max-width: 72ch; }
.result .snip mark { background: #FFF1A8; color: inherit; padding: 0 1px; }
.result .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.result .tags .face { width: 18px; height: 18px; border: 0; margin: 0; }
.result .when { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wtag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px 2px; border-radius: 4px; font-size: 10.5px; letter-spacing: .07em; font-weight: 500; border: 0; text-transform: uppercase; }
.wtag.working { background: var(--working-bg); color: var(--working-fg); }
.wtag.watching { background: var(--watching-bg); color: var(--watching-fg); }
.wtag.none, .status.none { background: var(--card); color: var(--faint); box-shadow: inset 0 0 0 1px var(--card-line-strong); }

/* Overlaps: a horizontal carousel of compact cards */
.car-nav { margin-left: auto; display: flex; gap: 6px; }
.car-nav button { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); background: var(--card); color: var(--muted); font-size: 14px; box-shadow: var(--shadow); }
.car-nav button:hover:not(:disabled) { color: var(--ink); background: var(--hover); }
.car-nav button:disabled { opacity: .4; cursor: default; }
.ovs { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; scroll-behavior: smooth; padding: 2px 2px 12px; margin: -2px -2px 0; scrollbar-width: thin; scrollbar-color: var(--card-line-strong) transparent; }
.ov { flex: 0 0 min(372px, 86%); scroll-snap-align: start; background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.ov.done { box-shadow: var(--shadow); justify-content: center; align-items: flex-start; color: var(--muted); font-size: 13.5px; }
.ov .ok { color: var(--ok); }
.ov-top { display: flex; gap: 8px; align-items: center; }
.ov-top .when { font-family: var(--font-mono); font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 3px 7px 2px; border-radius: 4px; }
.ov-top .faces { margin-left: auto; }
.ov-top .face { width: 22px; height: 22px; margin-left: -6px; }
.ov h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.3; letter-spacing: -0.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ov-sum { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ov-pair { display: flex; flex-direction: column; border: 1px solid var(--hair); border-radius: 8px; background: var(--tint); }
.ov-side { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: center; background: none; border: 0; padding: 8px 10px; text-align: left; border-radius: 8px; }
.ov-side + .ov-side { border-top: 1px solid var(--hair); border-radius: 0 0 8px 8px; }
.ov-side:hover { background: var(--hover); }
.ov-side b { font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-file { grid-column: 2; font-size: 12px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-decide { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; background: var(--accent-soft); padding: 8px 10px; border-radius: 8px; }
.ov-decide .idx { background: var(--card); width: 20px; height: 20px; }
.ov-decide .idx img { width: 8px; height: 12px; }
.ov-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 2px; }
.ov-foot .btn { padding: 5px 10px; font-size: 12.5px; }
.ov-done-note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.sec-h h3 { margin: 0; font-size: 15px; font-weight: 500; }
.sec-h span { color: var(--faint); font-size: 12px; }

/* Teams working near you */
.nears { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.near { background: var(--card); border: 1px dashed var(--card-line-strong); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.near:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }
.near-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.near-to { font-size: 11.5px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.near h3 { margin: 0; font-size: 15px; font-weight: 500; }
.near p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; }
.near-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.near-foot .alert { color: var(--warn); }
.wslink { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; }
.wslink:hover { color: var(--accent); }
.tag { font-size: 11.5px; padding: 2px 8px; font-weight: 500; border-radius: 999px; }
.tag.stale { background: var(--warn-soft); color: var(--warn); }
.tag.fixed { background: var(--ok-soft); color: var(--ok); }
.tag.key { background: var(--accent-soft); color: var(--accent); }
.nores { padding: 28px 18px; color: var(--muted); text-align: center; }

.mini { display: flex; flex-direction: column; }
.mini button { display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; border-top: 1px solid var(--hair); padding: 12px 18px; width: 100%; }
.mini button:first-child { border-top: 0; }
.mini button:hover { background: var(--tint); }
.mini .nm { font-weight: 500; display: block; }
.mini .sub { color: var(--muted); font-size: 12px; display: block; }
.mini .face { width: 30px; height: 30px; margin: 0; border: 0; }

/* Workstream page */
.ws-head { display: flex; flex-direction: column; gap: 12px; }
.ws-head .status { position: static; transform: none; align-self: flex-start; }
.ws-head h1 { margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.015em; }
.ws-head p { margin: 0; color: var(--muted); max-width: 64ch; font-size: 15px; }
.ws-head .acts { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.refs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding: 22px 20px 24px; }
.ref { background: var(--sheet); border: 1px solid var(--card-line-strong); border-radius: 8px; padding: 14px 14px 12px; min-height: 210px; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 1px 3px rgba(16,16,24,.06); text-align: left; transition: transform .2s, border-color .2s; }
.ref:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.ref .k { font-family: var(--font-mono); font-size: 10px; color: var(--faint); text-transform: uppercase; }
.ref b { font-size: 15px; font-weight: 500; }
.ref p { margin: 0; font-size: 12.5px; color: var(--muted); flex: 1; }
.ref .by { font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.ref .by .face { width: 16px; height: 16px; margin: 0; border: 0; }
.team .grp { padding: 14px 18px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 10px; }
.team .grp:first-child { border-top: 0; }
.team h4 { margin: 0; font-size: 11px; color: var(--faint); font-weight: 500; letter-spacing: .07em; text-transform: uppercase; }
.member { display: flex; align-items: center; gap: 10px; }
.member .face { width: 32px; height: 32px; margin: 0; border: 0; }
.member .face.dim { filter: grayscale(1); opacity: .7; }
.member small { display: block; color: var(--muted); font-size: 12px; }
.feed .it { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 11px 18px; border-top: 1px solid var(--hair); font-size: 13px; }
.feed .it:first-child { border-top: 0; }
.feed .it .face, .feed .it .idx { width: 22px; height: 22px; margin: 0; border: 0; }
.feed .it .idx img { width: 9px; height: 13px; }
.feed .it small { display: block; color: var(--faint); font-size: 11.5px; }
.wsask { display: flex; gap: 8px; padding: 14px 18px; }
.wsask input { flex: 1; min-width: 0; border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); padding: 8px 10px; background: var(--tint); }

/* File viewer */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(16, 16, 24, .32); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding-block: calc(40px + env(safe-area-inset-top, 0px)) 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.doc { width: min(720px, 100%); background: var(--sheet); border: 1px solid var(--card-line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lift); animation: up .22s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(12px); opacity: .5; } }
.doc-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); background: var(--tint); }
.doc-bar .mono { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.doc-bar .x { width: 30px; height: 30px; border: 0; background: none; font-size: 18px; color: var(--muted); flex: none; }
.doc-bar .x:hover { color: var(--accent); }
.doc-main { padding: 34px 44px 40px; display: flex; flex-direction: column; gap: 16px; }
.doc-main .k { font-family: var(--font-mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.doc-main h2 { margin: -6px 0 0; font-size: 28px; font-weight: 500; letter-spacing: -0.015em; text-wrap: balance; }
.doc-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.doc-meta .face { width: 22px; height: 22px; border: 0; margin: 0; }
.doc-main h3 { margin: 10px 0 0; font-size: 15px; font-weight: 500; }
.doc-main p { margin: 0; font-size: 15px; line-height: 1.65; max-width: 64ch; }
.doc-main .hl { background: var(--ok-soft); }
.doc-main .stale-p { background: var(--warn-soft); }
.doc-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--hair); background: var(--tint); }

/* Settings */
.settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 36px; align-items: start; }
.snav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 84px; }
.snav button { text-align: left; background: none; border: 0; border-radius: var(--r-sm); padding: 7px 10px; color: var(--muted); font-size: 13.5px; }
.snav button:hover { color: var(--ink); background: var(--hover); }
.snav button[aria-current="true"] { color: var(--ink); background: var(--hover); font-weight: 500; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--hair); }
.srow:first-child { border-top: 0; }
.srow b { font-weight: 500; display: block; }
.srow small, .srow .mono { color: var(--muted); display: block; font-size: 12px; }
.srow .mono { color: var(--faint); font-size: 11.5px; }
.seg { display: inline-flex; border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 6px 11px; font-size: 12.5px; color: var(--muted); border-left: 1px solid var(--card-line-strong); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.seg button[aria-pressed="true"][data-v="block"] { background: var(--bad-soft); color: var(--bad); }
.switch { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--card-line-strong); border: 0; padding: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.profile { display: flex; gap: 16px; align-items: center; padding: 18px; }
.profile img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.profile b { font-size: 17px; font-weight: 500; display: block; }
.profile small { color: var(--muted); }
.field { border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); padding: 6px 9px; background: var(--card); font-size: 13px; }

/* Login: product visual on the left, sign-in on the right */
body.auth .top { display: none; }
.login { min-height: calc(100vh - 150px); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: stretch; }
.login-hero { background: linear-gradient(165deg, #E9EBFD 0%, #F3F3F8 55%, #F7F7F8 100%); border: 1px solid var(--card-line); border-radius: 16px; padding: 36px 40px 0; display: flex; flex-direction: column; overflow: hidden; }
.login-hero .brand { cursor: default; margin-bottom: 36px; }
.login-hero h1 { font-size: 40px; line-height: 1.06; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 14px; text-wrap: balance; max-width: 15em; }
.login-hero h1 em { font-style: normal; color: var(--accent); }
.login-hero .lede { font-size: 16px; color: var(--muted); margin: 0; max-width: 30em; line-height: 1.5; }
.login-side { display: flex; align-items: center; justify-content: center; padding: 24px 0; }
.login-card { width: min(380px, 100%); }
.login-card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 500; letter-spacing: -0.015em; }
.login-card .sub { margin: 0 0 26px; color: var(--muted); }
.auth-box { display: flex; flex-direction: column; gap: 10px; }
.auth-box .btn { padding: 10px 16px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.auth-box .btn svg { width: 17px; height: 17px; }
.auth-box .or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; margin: 8px 0; }
.auth-box .or::before, .auth-box .or::after { content: ""; flex: 1; height: 1px; background: var(--card-line); }
.auth-box label { font-size: 13px; font-weight: 500; }
.auth-box input { border: 1px solid var(--card-line-strong); border-radius: var(--r-sm); background: var(--card); padding: 10px 12px; font-size: 14px; outline: 0; }
.auth-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.auth-fine { color: var(--faint); font-size: 12px; margin-top: 22px; line-height: 1.5; }
.auth-fine a, .auth-alt a { color: var(--muted); }
.auth-alt { color: var(--muted); font-size: 13px; margin-top: 18px; }
.auth-err { color: var(--bad); font-size: 12.5px; }
.login-art { position: relative; flex: 1; min-height: 360px; margin-top: 28px; }
.login-art .la-doc { position: absolute; width: 230px; background: var(--sheet); border: 1px solid var(--card-line-strong); border-radius: 8px; padding: 16px 16px 18px; box-shadow: var(--shadow-lift); }
.login-art .la-doc .k { font-family: var(--font-mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.login-art .la-doc b { display: block; font-weight: 500; font-size: 15px; margin: 6px 0 10px; }
.login-art .la-doc i { display: block; height: 6px; border-radius: 3px; background: var(--hair); margin-top: 7px; }
.login-art .la-doc i.hl { background: var(--warn-soft); box-shadow: inset 0 0 0 1px #EBD3A6; }
.login-art .la-a { left: 2%; top: 40px; transform: rotate(-3deg); }
.login-art .la-b { right: 4%; top: 120px; transform: rotate(2.5deg); }
.login-art .la-team { position: absolute; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.login-art .la-ta { left: 4%; top: 6px; } .login-art .la-tb { right: 6%; top: 86px; }
.login-art .la-flag { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: min(380px, 92%); background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); box-shadow: var(--shadow-lift); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.login-art .la-flag b { font-weight: 500; display: block; margin-bottom: 3px; }
.login-art .la-flag small { color: var(--muted); font-size: 13px; line-height: 1.45; display: block; }
.login-art svg.la-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* Help */
.help { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 36px; align-items: start; }
.help-hero h1 { margin: 0 0 8px; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
.help-hero p { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.help section { scroll-margin-top: 84px; }
.help h2 { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.step { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.step b { display: block; font-weight: 500; margin-bottom: 4px; }
.step p { margin: 0; color: var(--muted); font-size: 13px; }
.feats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.feat { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 84px; }
.feat .ic { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.feat .ic svg { width: 17px; height: 17px; }
.feat h3 { margin: 4px 0 0; font-size: 14.5px; font-weight: 500; }
.feat p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; flex: 1; }
.feat .btn { align-self: flex-start; margin-top: 4px; }
.faq details { border-top: 1px solid var(--hair); padding: 14px 18px; }
.faq details:first-child { border-top: 0; }
.faq summary { cursor: pointer; font-weight: 500; }
.faq details p { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.help-contact { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; flex-wrap: wrap; }
.help-contact p { margin: 0; color: var(--muted); }

/* Site footer */
.site-foot { border-top: 1px solid var(--card-line); background: var(--card); }
.site-foot .in { max-width: 1280px; margin: 0 auto; padding: 18px max(24px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; color: var(--faint); font-size: 12.5px; }
.site-foot nav { display: flex; gap: 6px 20px; flex-wrap: wrap; margin-left: auto; }
.site-foot a { color: var(--muted); text-decoration: none; }
.site-foot a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* Create or join flow */
.flow { width: min(620px, 100%); background: var(--card); border: 1px solid var(--card-line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lift); animation: up .22s cubic-bezier(.2,.8,.2,1); }
.flow-bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.flow-bar h2 { margin: 0; font-size: 16px; font-weight: 500; flex: 1; }
.flow-bar .x { width: 30px; height: 30px; border: 0; background: none; font-size: 18px; color: var(--muted); }
.flow-bar .x:hover { color: var(--accent); }
.flow-tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--hair); }
.flow-tabs button { background: none; border: 0; padding: 12px 10px 11px; color: var(--muted); font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.flow-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.flow-main { padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; }
.flow-main label.lbl { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 500; }
.flow-main label.lbl small { color: var(--muted); font-weight: 400; }
.flow-main input[type="text"], .flow-main input[type="search"], .flow-main textarea { border: 1px solid var(--card-line-strong); background: var(--card); padding: 10px 12px; font-size: 14px; font-weight: 400; border-radius: var(--r-sm); outline: 0; width: 100%; }
.flow-main textarea { min-height: 70px; resize: vertical; }
.flow-main input:focus, .flow-main textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.flow-main .grp h4 { margin: 0 0 8px; font-size: 13px; font-weight: 500; }
.flow-main .grp h4 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--card-line-strong); border-radius: 999px; background: var(--card); padding: 4px 11px 4px 4px; font-size: 13px; }
.chip .face { width: 22px; height: 22px; margin: 0; border: 0; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip.src { padding: 6px 11px; }
.chip.src[disabled] { color: var(--faint); border-style: dashed; cursor: not-allowed; }
.jrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--hair); }
.jrow:first-child { border-top: 0; padding-top: 0; }
.jrow h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.jrow p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.jrow .faces { justify-content: flex-start; }
.jrow .face { width: 22px; height: 22px; margin-left: -5px; }
.jrow .acts { display: flex; gap: 6px; }
.flow-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--hair); background: var(--tint); }
.flow .trace .line { font-size: 13.5px; }

.toast { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 8px; box-shadow: var(--shadow-lift); padding: 10px 16px; font-size: 13px; z-index: 60; }

@media (max-width: 1100px) {
  .nears { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .home, .page { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}
@media (max-width: 900px) {
  .login { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .login-hero { padding-bottom: 32px; }
  .login-art { display: none; }
  .help { grid-template-columns: minmax(0, 1fr); }
  .help .snav { position: static; flex-direction: row; flex-wrap: wrap; }
  .steps, .feats { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .top-in { flex-wrap: wrap; gap: 10px 12px; padding-block: 10px; }
  .tools { margin-left: auto; }
  .searchrow { order: 3; flex-basis: 100%; }

const keyRefs = w => FILES.filter(f => f.ws === w.id && f.key).sort((a, b) => a.key - b.key);
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }

function go(view, opts = {}) {
  Object.values(ovState).forEach(s => delete s.justThreaded);
  Object.assign(state, { view }, opts);
  closePops(); render(); window.scrollTo({ top: 0 });
}
$('#homeBtn').addEventListener('click', () => { $('#q').value = ''; go('home'); });
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) go('search', { query: q, scope: state.view === 'ws' ? state.wsId : state.view === 'search' ? state.scope : null, tab: 'all' }); });

// ---------- popovers ----------
function closePops() { ['filter','notif','settings'].forEach(k => { $(`#${k}Pop`).hidden = true; $(`#${k}Btn`).setAttribute('aria-expanded', 'false'); }); }
function togglePop(k, fill) {
  const p = $(`#${k}Pop`); const open = p.hidden; closePops();
  if (open) { fill(); p.hidden = false; $(`#${k}Btn`).setAttribute('aria-expanded', 'true'); }
}
// composedPath keeps the original path even when a click re-renders (and detaches) its own target
document.addEventListener('click', e => { if (!e.composedPath().some(n => n.classList?.contains('popwrap'))) closePops(); });
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-dead], a[data-help]'); if (!a) return;
  e.preventDefault();
  if (a.hasAttribute('data-help')) go('help');
});

const openCount = () => state.inbox.filter(n => !n.done).length;
function updateBell() {
  const n = openCount(); const c = $('#notifCount');
  c.hidden = !n; c.textContent = n;
  $('#notifBtn').setAttribute('aria-label', n ? `Notifications, ${n} open` : 'Notifications');

}));

    <div class="grp"><h4>File types</h4>
      ${TYPES.map(([k, l]) => `<label><input type="checkbox" id="ft-${k}" data-k="${k}" ${state.types.has(k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <div class="grp"><h4>Updated</h4>
      ${[['any','Any time'],['7','Past week'],['30','Past month']].map(([v, l]) => `<label><input type="radio" name="fdate" id="fd-${v}" value="${v}" ${state.date === v ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <button class="btn ghost" id="fClear" type="button" style="align-self:flex-start;padding-left:0">Clear filters</button>`;
  const apply = () => { updateFilterBadge(); if (state.view === 'search') render(); };

$('#settingsBtn').addEventListener('click', () => togglePop('settings', () => {

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').innerHTML) closeFile(); else closePops(); }
  if (e.key === '/' && !e.target.closest('input, textarea')) { e.preventDefault(); $('#q').focus(); }
});

// ---------- file viewer ----------
function openFile(id) {
  const f = fileBy[id]; const w = wsBy[f.ws]; const rep = REPAIRS[id];
  const blocked = !readable(f);
  const bodyHTML = blocked
    ? `<p style="color:var(--muted)">Index isn't allowed to open files in ${esc(src(srcFor(f)).label)}. Change this in Settings, Sources.</p>`
    : `<p class="${f.stale ? 'stale-p' : f.fixed ? 'hl' : ''}">${esc(f.text)}</p>${(f.body || []).map(([h, p]) => f.type === 'slack' ? `<p><b style="font-weight:500">${esc(h)}:</b> ${esc(p)}</p>` : `<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}`;
  $('#modal').innerHTML = `<div class="overlay" id="overlay"><article class="doc" role="dialog" aria-modal="true" aria-label="${esc(f.title)}">
    <div class="doc-bar"><span class="mono">${esc(f.path)}${f.type === 'slack' ? '' : esc(f.title)}</span><button class="x" id="closeDoc" type="button" aria-label="Close">✕</button></div>
    <div class="doc-main">
      <span class="k">${esc(f.kind)} · ${esc(w.name)}</span>
      <h2>${esc(f.title)}</h2>
      <div class="doc-meta">${face(f.owner)}<span>${esc(PEOPLE[f.owner].name)}</span><span>·</span><span>Updated ${fmt(f.at)}</span>${f.key ? '<span class="tag key">Key reference</span>' : ''}${f.stale ? '<span class="tag stale">Out of date</span>' : ''}${f.fixed ? '<span class="tag fixed">Repaired by Index</span>' : ''}</div>
      ${f.stale && rep && !blocked ? `<div class="repair" id="docRepair"><div><strong>Index found newer information.</strong> <span style="color:var(--muted)">${esc(rep.why)}</span></div>
        <div class="diff"><span class="mono" style="color:var(--faint)">${esc(rep.section)}</span><del>${esc(rep.del)}</del><ins>${esc(rep.ins)}</ins></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="docApply" type="button">Apply fix</button><button class="btn" id="docSend" type="button">Send to ${esc(first(f.owner))}</button></div></div>` : ''}
      ${bodyHTML}
    </div>
    <div class="doc-foot"><button class="btn" id="docWs" type="button">Open ${esc(w.name)}</button><button class="btn" id="docAsk" type="button">Ask Index about this file</button></div>
  </article></div>`;
  document.body.classList.add('modal-open');
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeFile(); });
  $('#closeDoc').addEventListener('click', closeFile); $('#closeDoc').focus();
  $('#docWs').addEventListener('click', () => { closeFile(); go('ws', { wsId: w.id }); });
  $('#docAsk').addEventListener('click', () => { closeFile(); const q = `What's the latest on ${f.title}?`; $('#q').value = q; go('search', { query: q, scope: w.id, tab: 'all' }); });
  if ($('#docApply')) {
    $('#docApply').addEventListener('click', () => { applyRepair(id); toast(`Updated ${f.title}`); openFile(id); render(); });
    $('#docSend').addEventListener('click', () => { $('#docRepair').innerHTML = `<span class="tag fixed" style="align-self:flex-start">Sent to ${esc(PEOPLE[f.owner].name)} for review</span>`; });
  }
}
function closeFile() { $('#modal').innerHTML = ''; document.body.classList.remove('modal-open'); }
function bindFiles(root) { root.querySelectorAll('[data-file]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openFile(b.dataset.file); })); }

// ---------- home ----------
function stackHTML(w) {
  const refs = keyRefs(w).slice(0, 3);
  if (!refs.length) return `<div class="empty">No files yet</div>`;
  // front sheet is the top reference; the others sit behind and fan out on hover
  const order = refs.length === 1 ? [['s2', refs[0]]] : refs.length === 2 ? [['s1', refs[1]], ['s2', refs[0]]] : [['s1', refs[1]], ['s3', refs[2]], ['s2', refs[0]]];
  return `<div class="stack n${refs.length}">${order.map(([pos, f]) => `<button type="button" class="sheet ${pos} ${pos !== 's2' ? 'behind' : ''}" data-file="${f.id}" aria-label="Open ${esc(f.title)}">
    <span class="k">${esc(f.kind)}</span><b>${esc(f.title)}</b><span class="t">${esc(f.text.slice(0, 64))}…</span></button>`).join('')}</div>
    <div class="stack-hint">Click a page to open it</div>`;
}
// ---------- overlaps ----------
const openOverlaps = () => OVERLAPS.filter(o => !ovState[o.id].dismissed && !ovState[o.id].thread);
function ovSide(wsId, fid) {
  const w = wsBy[wsId]; const f = fileBy[fid];
  return `<button type="button" class="ov-side" data-file="${f.id}" title="${esc(f.text)}">
    <span class="wtag ${w.status}">${statusLabel(w)}</span><b>${esc(w.name)}</b>
    <span class="ov-file">${esc(f.title)}</span></button>`;
}
function ovCard(o) {
  const s = ovState[o.id];
  const names = o.people.map(p => PEOPLE[p].name).join(' and ');
  if (s.dismissed) return `<article class="ov done" data-ov="${o.id}"><span>Marked “${esc(o.title)}” as not a conflict.</span><button class="btn" data-ovact="undo" type="button">Undo</button></article>`;
  if (s.thread) return `<article class="ov done" data-ov="${o.id}"><span class="ok">✓ Started a thread with ${esc(names)}.</span><span>Index attached both documents.</span></article>`;
  return `<article class="ov" data-ov="${o.id}">
    <div class="ov-top"><span class="when">${esc(o.when)}${o.days ? ` · ${o.days}d` : ''}</span><div class="faces" title="${esc(names)}">${o.people.map(p => face(p)).join('')}</div></div>
    <h3>${esc(o.title)}</h3>
    ${s.decide ? `<div class="ov-decide">${idxMark}<span>${esc(o.decide)}</span></div>` : `<p class="ov-sum">${esc(o.summary)}</p>`}
    <div class="ov-pair">${ovSide(o.a, o.fa)}${ovSide(o.b, o.fb)}</div>
    <div class="ov-foot">
      <button class="btn primary" data-ovact="thread" type="button">Start a thread</button>
      ${s.decide ? '' : '<button class="btn" data-ovact="decide" type="button">Who decides?</button>'}
      <button class="btn ghost" data-ovact="dismiss" type="button">Dismiss</button></div>
  </article>`;
}
function carouselHTML(id, list, empty) {
  return `<div class="ovs" id="${id}">${list.map(ovCard).join('') || `<article class="ov done"><span class="ok">✓ ${empty}</span></article>`}</div>`;
}
const carNav = id => `<div class="car-nav" data-car="${id}"><button type="button" data-dir="-1" aria-label="Previous">←</button><button type="button" data-dir="1" aria-label="Next">→</button></div>`;
function bindCarousel(id) {
  const track = document.getElementById(id); const nav = document.querySelector(`[data-car="${id}"]`);
  if (!track || !nav) return;
  const [prev, next] = nav.querySelectorAll('button');
  const sync = () => { prev.disabled = track.scrollLeft < 4; next.disabled = track.scrollLeft + track.clientWidth > track.scrollWidth - 4; };
  const step = () => (track.firstElementChild?.getBoundingClientRect().width || 360) + 16;
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => track.scrollBy({ left: step() * +b.dataset.dir, behavior: reduced ? 'auto' : 'smooth' })));
  track.addEventListener('scroll', sync, { passive: true }); sync();
}
function bindOverlaps(root, rerender) {
  root.querySelectorAll('[data-ovact]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const id = b.closest('[data-ov]').dataset.ov; const s = ovState[id]; const o = OVERLAPS.find(x => x.id === id);
    const act = b.dataset.ovact;
    if (act === 'thread') { s.thread = true; s.justThreaded = true; toast(`Started a thread with ${o.people.map(first).join(' and ')}`); [o.a, o.b].forEach(w => (state.extraFeed[w] ||= []).unshift({ who: 'me', text: `Started a thread about “${o.title}”`, when: 'Just now' })); }
    if (act === 'decide') s.decide = true;
    if (act === 'dismiss') s.dismissed = true;
    if (act === 'undo') s.dismissed = false;
    rerender();
  }));
  bindFiles(root);
}
const statusLabel = w => w.status === 'none' ? 'Not following' : w.status;

function nearCard(w) {
  const to = wsBy[w.near.to];
  const ov = overlapsFor(w.id).length;
  return `<article class="near" tabindex="0" role="link" data-ws="${w.id}" aria-label="${esc(w.name)}">
    <div class="near-top">${faces(w.team)}<span class="near-to">Near ${esc(to.name)}</span></div>
    <h3>${esc(w.name)}</h3>
    <p>${esc(w.near.why)}.</p>
    <div class="near-foot">${ov ? `<span class="alert">${ov} overlap</span>` : `<span>${FILES.filter(f => f.ws === w.id).length} file</span>`}<span style="flex:1"></span>
      ${w.status === 'none' ? '<button class="btn" data-watch type="button">Watch</button>' : '<span class="wtag watching">Watching</span>'}</div>
  </article>`;
}
function watchWs(id, on) {
  const w = wsBy[id];
  w.status = on ? 'watching' : 'none';
  w.watch = on ? [...new Set([...w.watch, 'me'])] : w.watch.filter(p => p !== 'me');
  toast(on ? `Watching ${w.name}` : `Stopped watching ${w.name}`);
}

function wsCard(w) {
  const files = FILES.filter(f => f.ws === w.id);
  const stale = files.filter(f => f.stale).length;
  const qs = state.inbox.filter(n => n.ws === w.id && !n.done).length;
  const ovs = overlapsFor(w.id).filter(o => openOverlaps().includes(o)).length;
  return `<article class="ws" tabindex="0" role="link" data-ws="${w.id}" aria-label="${esc(w.name)}">
    <span class="status ${w.status}">${w.status.toUpperCase()}</span>
    <h3>${esc(w.name)}</h3>
    ${faces(w.team)}
    ${stackHTML(w)}
    ${files.length ? `<div class="meta"><span>${files.length} files</span>${ovs ? `<span class="alert">${ovs} overlap${ovs > 1 ? 's' : ''}</span>` : ''}${stale ? `<span class="alert">${stale} out of date</span>` : ''}${qs ? `<span class="you">${qs} for you</span>` : ''}</div>` : ''}
  </article>`;
}
function renderHome(el) {
  const list = WS.filter(w => w.status !== 'none');
  const working = list.filter(w => w.status === 'working').length;
  const near = WS.filter(w => w.near);
  const ovs = OVERLAPS.filter(o => !ovState[o.id].thread || ovState[o.id].justThreaded);
  const done = OVERLAPS.filter(o => ovState[o.id].thread).length;
  const keepX = $('#ovList')?.scrollLeft || 0;
  el.innerHTML = `<div class="home">
      <section>
        <h2>Overlaps with other teams <small>${openOverlaps().length} need a decision${done ? ` · ${done} handled in a thread` : ''}</small>${ovs.length > 1 ? carNav('ovList') : ''}</h2>
        ${carouselHTML('ovList', ovs, 'No open overlaps. Index compares plans across teams every day and will flag the next one here.')}
      </section>
      <section>
        <h2>Your workstreams <small>${working} working on · ${list.length - working} watching</small></h2>
        <div class="grid">${list.map(wsCard).join('')}
          <article class="ws create" tabindex="0" role="button" id="createWs"><img src="icons/add.svg" alt="">Create or join a workstream</article>
        </div>
      </section>
      <section>
        <h2>Teams working near you <small>Workstreams you don't follow that touch the same areas</small></h2>
        <div class="nears">${near.map(nearCard).join('')}</div>
      </section>
  </div>`;
  $('#ovList').style.scrollBehavior = 'auto'; $('#ovList').scrollLeft = keepX; $('#ovList').style.scrollBehavior = '';
  el.querySelectorAll('.ws[data-ws], .near[data-ws]').forEach(c => {
    const open = () => go('ws', { wsId: c.dataset.ws });
    c.addEventListener('click', open); c.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === c) open(); });
  });
  el.querySelectorAll('[data-watch]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); watchWs(b.closest('[data-ws]').dataset.ws, true); renderHome(el); }));
  bindOverlaps($('#ovList'), () => renderHome(el));
  bindCarousel('ovList');
  bindFiles(el.querySelector('.grid'));
  bindFiles(el.querySelector('.nears'));
  $('#createWs').addEventListener('click', () => openFlow('join'));
  $('#createWs').addEventListener('keydown', e => { if (e.key === 'Enter') openFlow('join'); });
}

// ---------- inbox ----------
function renderInbox(box, wsFilter) {
  updateBell();
  const items = state.inbox.filter(n => !wsFilter || n.ws === wsFilter);
  if (!items.length) { box.innerHTML = `<div class="note"><p class="msg" style="color:var(--muted)">Nothing needs you here.</p></div>`; return; }
  box.innerHTML = items.map(n => {
    const w = wsBy[n.ws];
    const where = `<button class="where" data-goto="${w.id}" type="button">@ ${esc(w.name)}</button>`;
    if (n.done) return `<div class="note">${where}<span class="done">✓ ${esc(n.done)}</span></div>`;
    if (n.kind === 'question') return `<div class="note" data-n="${n.id}">${where}
      <div class="who">${face(n.from)}${esc(PEOPLE[n.from].name)}<small>${n.when}</small></div>
      <p class="msg">${esc(n.text)}</p>
      <div class="slot"><div class="row">${state.draftReplies ? '<button class="btn primary" data-act="draft" type="button">Draft reply with Index</button>' : ''}<button class="btn" data-act="reply" type="button">Reply</button></div></div></div>`;
    if (n.kind === 'stale') { const f = fileBy[n.file]; const r = REPAIRS[n.file]; return `<div class="note" data-n="${n.id}">${where}
      <div class="who">${idxMark}Index<small>${n.when}</small></div>
      <p class="msg"><button class="wslink" style="font-size:inherit;color:var(--accent)" data-file="${f.id}" type="button">${esc(f.title)}</button> is out of date. ${esc(r.why)}</p>
      <div class="slot"><div class="row"><button class="btn primary" data-act="review" type="button">Review fix</button><button class="btn ghost" data-act="dismiss" type="button">Dismiss</button></div></div></div>`; }
    return `<div class="note" data-n="${n.id}">${where}
      <div class="who">${idxMark}Index needs context<small>${n.when}</small></div>
      <p class="msg">${esc(n.text)}</p>
      <div class="slot"><textarea id="ctx-${n.id}" placeholder="Type what you know. Index will add it to the brief."></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-act="ctx" type="button">Add to brief</button><button class="btn" data-act="askjen" type="button">Ask Jen instead</button></div></div></div>`;
  }).join('');
  box.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => go('ws', { wsId: b.dataset.goto })));
  box.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => inboxAct(b, box, wsFilter)));
  bindFiles(box);
}
function finishNote(id, msg, box, wsFilter) { state.inbox.find(n => n.id === id).done = msg; renderInbox(box, wsFilter); }
async function inboxAct(b, box, wsFilter) {
  const noteEl = b.closest('.note'); const n = state.inbox.find(x => x.id === noteEl.dataset.n); const slot = noteEl.querySelector('.slot');
  const act = b.dataset.act;
  if (act === 'draft' || act === 'reply') {
    slot.innerHTML = `<div class="trace" ${act === 'reply' ? 'hidden' : ''}><div class="line run"><i><span class="spin"></span></i>Reading 4 files in Update permissions…</div></div><textarea id="reply-${n.id}" placeholder="Write a reply…"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-send type="button">Send to ${esc(first(n.from))}</button></div>`;
    if (act === 'draft') {
      await wait(1100);
      slot.querySelector('.trace').innerHTML = `<div class="line"><i>✓</i>Drafted from Architecture review notes and #platform-api</div>`;
      slot.querySelector('textarea').value = 'We\'re enforcing roles at the API gateway with a 60-second role cache. Services keep a fallback check for admin-only endpoints. This was decided at the Oct 23 architecture review (notes are pinned in the workstream).';
    }
    slot.querySelector('[data-send]').addEventListener('click', () => {
      const v = slot.querySelector('textarea').value.trim(); if (!v) { slot.querySelector('textarea').focus(); return; }
      (state.extraFeed[n.ws] ||= []).unshift({ who: 'me', text: `Answered ${first(n.from)}: architecture decision`, when: 'Just now' });
      finishNote(n.id, `Replied to ${first(n.from)}. Index saved the answer to this workstream.`, box, wsFilter); toast(`Reply sent to ${first(n.from)}`);
    });
  } else if (act === 'review') {
    const r = REPAIRS[n.file]; const f = fileBy[n.file];
    slot.innerHTML = `<div class="diff"><span class="mono" style="color:var(--faint)">${esc(r.section)}</span><del>${esc(r.del)}</del><ins>${esc(r.ins)}</ins></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" data-apply type="button">Apply fix</button><button class="btn" data-send type="button">Send to ${esc(first(f.owner))}</button></div>`;
    slot.querySelector('[data-apply]').addEventListener('click', () => { applyRepair(n.file); finishNote(n.id, `Updated ${f.title}`, box, wsFilter); toast(`Updated ${f.title}`); render(); });
    slot.querySelector('[data-send]').addEventListener('click', () => finishNote(n.id, `Sent the suggested edit to ${PEOPLE[f.owner].name}`, box, wsFilter));

function resultRow(f, terms) {

const STOP = new Set('the what why when how did does are was for and with our who can before about this that from into have has will there their they you your any all get got its it is of on in to a an we be do at or by latest'.split(' '));
function search(q, scope) {
  const terms = (q.toLowerCase().match(/[a-z0-9-]{3,}/g) || []).filter(t => !STOP.has(t));
  const pool = FILES.filter(f => (!scope || f.ws === scope) && passesFilters(f));
  const sc = SCENARIOS.find(s => s.re.test(q) && (!scope || s.ws === scope));
  const scored = pool.map(f => {
    const hay = (f.title + ' ' + f.text + ' ' + f.kind + ' ' + wsBy[f.ws].name).toLowerCase();
    let s = terms.reduce((n, t) => n + (hay.includes(t) ? 1 : 0), 0);
    if (sc && sc.hits.includes(f.id)) s += 5 - sc.hits.indexOf(f.id) * .5;
    return { f, s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.f);
  const ws = WS.filter(w => (!scope || w.id === scope) && terms.some(t => (w.name + ' ' + w.desc).toLowerCase().includes(t)));
  const ppl = Object.keys(PEOPLE).filter(id => id !== 'me' && terms.some(t => (PEOPLE[id].name + ' ' + PEOPLE[id].role).toLowerCase().includes(t)));
  scored.slice(0, 3).forEach(f => { if (!ppl.includes(f.owner) && f.owner !== 'me') ppl.push(f.owner); });
  return { terms, files: scored, ws, ppl: ppl.slice(0, 5), sc };
}

async function runAnswer(r) {
  const my = ++runId; const alive = () => my === runId && $('#ansBody');
  const body = $('#ansBody');
  const lines = [];
  const draw = () => body.innerHTML = `<div class="trace">${lines.map(l => `<div class="line ${l.c || ''}"><i>${l.c === 'run' ? '<span class="spin"></span>' : l.c === 'ask' ? '?' : l.c === 'skip' ? '–' : '✓'}</i><span>${l.t}</span></div>`).join('')}</div><div id="ansExtra"></div>`;
  const step = async (t, ms, c = '') => { lines.push({ t, c: 'run' }); draw(); await wait(ms); lines[lines.length - 1] = { t, c }; draw(); };

  await step(r.sc ? `Looking for a decision in <b style="font-weight:500">${esc(wsBy[r.sc.ws].name)}</b>` : `Looking for “${esc(r.terms.join(', ') || state.query)}”`, 600); if (!alive()) return;
  const allowed = SOURCES.filter(s => s.mode === 'allow');
  await step(`Searched ${allowed.length} sources on your machine and team drives (${allowed.reduce((n, s) => n + s.items, 0).toLocaleString()} items)`, 700); if (!alive()) return;
  SOURCES.filter(s => s.mode !== 'allow').forEach(s => lines.push({ t: `Skipped ${esc(s.path)} because you blocked it`, c: 'skip' }));
  const usable = r.files.filter(readable).slice(0, 4);
  if (usable.length) { await step(`Read ${usable.length} file${usable.length > 1 ? 's' : ''}: ${usable.map(f => esc(f.title)).join(', ')}`, 700); if (!alive()) return; }

  let ctx = null;
  if (r.sc && r.sc.gap && state.askPolicy !== 'never') {
    lines.push({ t: 'Missing context', c: 'ask' }); draw();
    ctx = await askGap(r.sc.gap, alive); if (!alive()) return;
    lines[lines.length - 1] = { t: ctx ? 'Added missing context' : 'Skipped missing context' }; draw();
  }
  await step('Wrote an answer', 600); if (!alive()) return;

  const confident = r.sc && (!r.sc.gap || ctx);
  let answer;
  if (r.sc) answer = r.sc.answer(ctx);
  else if (usable.length) answer = usable.slice(0, 2).map(f => `${esc(f.text)}<button class="cite" data-f="${f.id}">${r.files.indexOf(f) + 1}</button>`).join(' ');
  else answer = `None of your allowed sources mention this yet. Try one of the people on the right, or change what Index can read in Settings.`;
  const trace = body.querySelector('.trace').outerHTML;
  const rep = r.sc && r.sc.repair && fileBy[r.sc.repair].stale && readable(fileBy[r.sc.repair]) ? r.sc.repair : null;
  body.innerHTML = `<p>${answer}</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="conf ${confident ? '' : 'mid'}">${confident ? 'High confidence' : usable.length ? 'Partial answer' : 'No answer found'}</span>
      <details class="how"><summary>How Index found this</summary>${trace}</details></div>
    ${rep ? `<div class="repair" id="repair"><div><strong>${esc(fileBy[rep].title)} is out of date.</strong> <span style="color:var(--muted)">${esc(REPAIRS[rep].why)}</span></div>
      <div class="diff"><del>${esc(REPAIRS[rep].del)}</del><ins>${esc(REPAIRS[rep].ins)}</ins></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="applyFix" type="button">Apply fix</button><button class="btn" id="sendFix" type="button">Send to ${esc(first(fileBy[rep].owner))}</button></div></div>` : ''}`;
  $('#ansState').textContent = '';
  body.querySelectorAll('.cite[data-f]').forEach(c => c.addEventListener('click', () => openFile(c.dataset.f)));
  if (rep) {
    $('#applyFix').addEventListener('click', () => { applyRepair(rep); $('#repair').innerHTML = `<span class="tag fixed" style="align-self:flex-start">Updated ${esc(fileBy[rep].title)}</span>`; toast('Doc updated'); });
    $('#sendFix').addEventListener('click', () => { $('#repair').innerHTML = `<span class="tag fixed" style="align-self:flex-start">Sent to ${esc(PEOPLE[fileBy[rep].owner].name)} for review</span>`; });
  }
}

  $('#modal').innerHTML = `<div class="overlay" id="overlay"><article class="flow" role="dialog" aria-modal="true" aria-label="Create or join a workstream" id="flow"></article></div>`;
  document.body.classList.add('modal-open');
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeFile(); });
  renderFlow();
}
function renderFlow() {
  const box = $('#flow'); if (!box) return;
  const bar = `<div class="flow-bar"><h2>Workstreams</h2><button class="x" id="flowX" type="button" aria-label="Close">✕</button></div>
    <div class="flow-tabs" role="tablist">${[['join','Join existing'],['create','Create new']].map(([k, l]) => `<button type="button" role="tab" data-ft="${k}" aria-selected="${flow.tab === k}">${l}</button>`).join('')}</div>`;
  if (flow.tab === 'join') {
    const q = flow.q.toLowerCase();
    const list = WS.filter(w => w.status !== 'working' && (!q || (w.name + ' ' + w.desc + ' ' + w.team.map(p => PEOPLE[p].name).join(' ')).toLowerCase().includes(q)));
    box.innerHTML = `${bar}<div class="flow-main">
      <input type="search" id="joinQ" placeholder="Search by name, team or teammate" aria-label="Search workstreams" value="${esc(flow.q)}">
      <div>${list.map(w => `<div class="jrow"><div>
          <h3>${esc(w.name)}<span class="wtag ${w.status}">${statusLabel(w)}</span></h3>
          <p>${esc(w.desc)}</p>
          <div style="display:flex;align-items:center;gap:8px">${faces(w.team)}<span style="font-size:12px;color:var(--muted)">${w.team.map(first).join(', ')}</span></div></div>
        <div class="acts">${w.status === 'none' ? `<button class="btn" data-fw="${w.id}" type="button">Watch</button>` : ''}<button class="btn primary" data-fj="${w.id}" type="button">Join</button></div></div>`).join('')
        || `<div class="nores" style="padding:12px 0">No workstreams match. <button class="btn ghost" id="toCreate" type="button" style="padding-left:0">Create “${esc(flow.q)}” instead</button></div>`}</div>
    </div>`;
    const qi = $('#joinQ');
    qi.addEventListener('input', () => { flow.q = qi.value; renderFlow(); const n = $('#joinQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
    box.querySelectorAll('[data-fj]').forEach(b => b.addEventListener('click', () => {
      const w = wsBy[b.dataset.fj]; joinWs(w.id); closeFile(); go('ws', { wsId: w.id }); toast(`Joined ${w.name}. Index added you to its questions.`);
    }));
    box.querySelectorAll('[data-fw]').forEach(b => b.addEventListener('click', () => { watchWs(b.dataset.fw, true); renderFlow(); render(); }));
    if ($('#toCreate')) $('#toCreate').addEventListener('click', () => { flow.name = flow.q; flow.tab = 'create'; renderFlow(); });
  } else {
    const ppl = Object.keys(PEOPLE).filter(p => p !== 'me');
    box.innerHTML = `${bar}<form class="flow-main" id="createForm">
      <label class="lbl">Name<input type="text" id="cName" placeholder="e.g. Usage-based pricing" value="${esc(flow.name)}" autocomplete="off"></label>
      <label class="lbl">What is the team doing? <small>Index uses this to find related files and spot overlaps with other teams</small><textarea id="cDesc" placeholder="One or two sentences">${esc(flow.desc)}</textarea></label>
      <div class="grp"><h4>Build the knowledge base from<small>Only sources you allow in Settings</small></h4>
        <div class="chips">${SOURCES.map(s => `<button type="button" class="chip src" data-cs="${s.id}" aria-pressed="${flow.srcs.has(s.id)}" ${s.mode === 'block' ? 'disabled title="Blocked in Settings"' : ''}>${esc(s.label)}</button>`).join('')}</div></div>
      <div class="grp"><h4>Invite teammates<small>Optional</small></h4>
        <div class="chips">${ppl.map(p => `<button type="button" class="chip" data-cp="${p}" aria-pressed="${flow.people.has(p)}">${face(p)}${esc(PEOPLE[p].name)}</button>`).join('')}</div></div>
      <span class="auth-err" id="cErr" hidden>Give the workstream a name.</span>
    </form>
    <div class="flow-foot"><button class="btn ghost" id="cCancel" type="button">Cancel</button><button class="btn primary" id="cGo" type="button">Create workstream</button></div>`;
    $('#cName').addEventListener('input', e => flow.name = e.target.value);
    $('#cDesc').addEventListener('input', e => flow.desc = e.target.value);
    box.querySelectorAll('[data-cs]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.cs; flow.srcs.has(k) ? flow.srcs.delete(k) : flow.srcs.add(k); b.setAttribute('aria-pressed', flow.srcs.has(k)); }));
    box.querySelectorAll('[data-cp]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.cp; flow.people.has(k) ? flow.people.delete(k) : flow.people.add(k); b.setAttribute('aria-pressed', flow.people.has(k)); }));
    $('#cCancel').addEventListener('click', closeFile);
    $('#createForm').addEventListener('submit', e => { e.preventDefault(); createWs(); });
    $('#cGo').addEventListener('click', createWs);
    if (!flow.name) $('#cName').focus();
  }
  $('#flowX').addEventListener('click', closeFile);
  box.querySelectorAll('[data-ft]').forEach(b => b.addEventListener('click', () => { flow.tab = b.dataset.ft; renderFlow(); }));
}
async function createWs() {
  const name = flow.name.trim();
  if (!name) { $('#cErr').hidden = false; $('#cName').focus(); return; }
  const srcs = [...flow.srcs]; const people = [...flow.people];
  const id = 'ws' + Date.now().toString(36);
  const box = $('#flow');
  const steps = [
    `Reading ${srcs.map(k => src(k).label).join(', ') || 'your files'}`,
    `Matching files about “${name}”`,
    'Comparing the plan with 9 other workstreams',
  ];
  box.innerHTML = `<div class="flow-bar"><h2>Setting up ${esc(name)}</h2></div><div class="flow-main"><div class="trace" id="cTrace"></div></div>`;
  for (const st of steps) {
    $('#cTrace').insertAdjacentHTML('beforeend', `<div class="line run"><i><span class="spin"></span></i>${esc(st)}…</div>`);
    await wait(750);
    if (!$('#cTrace')) return;
    const l = $('#cTrace').lastElementChild; l.classList.remove('run'); l.querySelector('i').textContent = '✓';
  }
  const w = { id, name, status: 'working', desc: flow.desc.trim() || 'New workstream. Add a description so Index can find related work.', team: ['me', ...people], watch: [] };
  WS.push(w); wsBy[id] = w;
  const slug = name.replace(/[^\w\s-]/g, '').trim();
  const found = [
    { id: id + 'f1', ws: id, kind: 'Brief', type: 'doc', title: `${slug} brief (draft)`, path: 'Drive / Drafts', owner: 'me', at: new Date(TODAY), key: 1, pinBy: 'me',
      text: 'Index started this brief from your description. Add goals, owners and dates so other teams can see what you\'re shipping.',
      body: [['Goals', 'Not written yet.'], ['Out of scope', 'Not written yet.']] },
  ];
  if (srcs.includes('desktop')) found.push({ id: id + 'f2', ws: id, kind: 'Notes', type: 'md', title: `${slug} notes.md`, path: '~/Desktop/', owner: 'me', at: ago(2), key: 2, pinBy: 'me',
    text: 'Rough notes found on your Desktop that mention this project. Index pinned them so the team can find them.' });
  if (srcs.includes('slack')) found.push({ id: id + 'f3', ws: id, kind: 'Thread', type: 'slack', title: `#${slug.toLowerCase().replace(/\s+/g, '-')}, kickoff`, path: 'Slack / kickoff', owner: people[0] || 'me', at: ago(1),
    text: 'kicking this off this week. dropping links here as we go.' });
  found.forEach(f => { FILES.push(f); fileBy[f.id] = f; });
  (state.extraFeed[id] ||= []).unshift({ who: 'idx', text: `Index found ${found.length} file${found.length > 1 ? 's' : ''} and checked for overlaps. None yet.`, when: 'Just now' });
  closeFile(); go('ws', { wsId: id });
  toast(people.length ? `Created ${name} and invited ${people.map(first).join(', ')}` : `Created ${name}`);
}

  ['kb', 'A knowledge base built from your files', 'Index reads the files, PDFs, docs, sheets and Slack threads in the sources you allow, then keeps a private index of them so answers come back fast.', 'Review sources', () => go('settings', { settingsTab: 'sources' }),

  ['perm', 'Permissions for data and files', 'Allow or block each folder and app. Index never opens a blocked source, and search results from it show no preview. People only see files they already have access to.', 'Open permissions', () => go('settings', { settingsTab: 'sources' }),
